<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Dolla Pulls | Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;font-size:10px}
.header{display:flex;justify-content:flex-end;align-items:center;padding:18px 26px;background:#0b1a33;box-shadow:0 1px 4px rgba(0,0,0,.5);font-size:10px}
.view-icon{padding:12px 20px;background:#ffc107;color:#000;border-radius:3px;font-size:9px;cursor:pointer;font-weight:bold;margin-left:4px}
.sms-icon{padding:12px 20px;background:#0dcaf0;color:#000;border-radius:3px;font-size:9px;cursor:pointer;font-weight:bold;position:relative}
.sms-badge{position:absolute;top:-8px;right:-8px;background:#dc3545;color:#fff;font-size:8px;padding:2px 4px;border-radius:50%;font-weight:bold}
.container{max-width:1200px;margin:auto;padding:8px}
.dashboard{display:flex;gap:8px;flex-wrap:wrap}
.card{flex:1;min-width:200px;background:#1a2a4d;padding:8px;border-radius:5px;box-shadow:0 1px 5px rgba(0,0,0,.5);font-size:10px;color:#fff;max-height:calc(100vh - 120px);overflow-y:auto}
.card h2{margin-top:0;color:#ffc107;font-size:11px}
.item{border-bottom:1px solid #3a4a6f;padding:7px 0;line-height:1.6;overflow-wrap:anywhere}
.item b{color:#dce6ff}
.row{display:flex;gap:4px;margin-top:5px}
button{flex:1;padding:5px;border:none;border-radius:3px;cursor:pointer;color:#fff;font-size:9px}
button:disabled{opacity:.5;cursor:not-allowed}
.approve{background:#198754}
.reject{background:#dc3545}
.footer{padding:6px;text-align:center}
.logout{background:#18f2c2;color:#000;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:10px;font-weight:bold}
.trx{color:#ffe08a;font-weight:bold;overflow-wrap:anywhere}
@media(max-width:768px){.dashboard{flex-direction:column}.card{max-height:none}}
</style>
</head>

<body>

<div class="header">
  <div class="sms-icon" onclick="openInbox()">
    📃 Details
    <span id="smsBadge" class="sms-badge" style="display:none;">0</span>
  </div>
  <div class="view-icon" onclick="openUserView()">👁 View</div>
</div>

<div class="container">
  <div class="dashboard">

    <div class="card">
      <h2>Pending Deposits</h2>
      <div id="depositList">Loading...</div>
      <p><b>Total Pending Deposits:</b> <span id="depositNumber">0</span></p>
    </div>

    <div class="card">
      <h2>Pending Withdraws</h2>
      <div id="withdrawList">Loading...</div>
      <p><b>Total Pending Withdraws:</b> <span id="withdrawNumber">0</span></p>
    </div>

    <div class="card">
      <h2>Pending Referrals</h2>
      <div id="referralList">Loading...</div>
      <p><b>Total Pending Referrals:</b> <span id="referralNumber">0</span></p>
    </div>

  </div>
</div>

<div class="footer">
  <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 collection,
 query,
 where,
 getDocs,
 serverTimestamp,
 runTransaction
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";


/* FIREBASE CONFIGURATION */

const firebaseConfig={
 apiKey:"AIzaSyBCylzF69zBzqNQ88mLj7aEXUyLqu3rNT0",
 authDomain:"dolla-pulls.firebaseapp.com",
 projectId:"dolla-pulls",
 storageBucket:"dolla-pulls.firebasestorage.app",
 messagingSenderId:"952761946013",
 appId:"1:952761946013:web:72fe061231ee8951c0e974"
};


/* GOOGLE APPS SCRIPT EMAIL CONFIGURATION */

const APPS_SCRIPT_URL=
"https://script.google.com/macros/s/AKfycbxHvdz28rbnvZxOIMz7Ki-LL9Rk16b0mSnY_-MS61worBwKjems3FNtu_FVIQ9fA0yA/exec";

const EMAIL_SHARED_TOKEN="DOLLA_PULLS_2026_CHANGE_THIS";


/* INITIALIZE FIREBASE */

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let adminReady=false;


/* SAFE HTML */

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,char=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 })[char]);
}


/* ERROR HANDLER */

function showActionError(error){
 console.error(error);
 alert(error?.message||"Operation failed. Please try again.");
}


/* EMAIL NOTIFICATION */

async function sendDepositEmail(requestId,event,deposit,adminNote=""){

 if(!["approved","rejected"].includes(event)){
  console.error("Invalid email event");
  return false;
 }

 const payload={
  secret:EMAIL_SHARED_TOKEN,
  event:event,
  requestId:requestId,
  uid:deposit.uid||"",
  customerName:deposit.customerName||"Customer",
  phone:deposit.customerPhone||deposit.phone||"",
  amount:deposit.amount??"",
  method:deposit.method||"",
  transactionId:deposit.trxId||deposit.transactionId||"",
  adminNote:adminNote||""
 };

 try{

  await fetch(APPS_SCRIPT_URL,{
   method:"POST",
   mode:"no-cors",
   headers:{
    "Content-Type":"text/plain;charset=utf-8"
   },
   body:JSON.stringify(payload)
  });

  console.log("Email request dispatched:",event,requestId);

  // no-cors cannot confirm actual Gmail delivery.
  return true;

 }catch(error){

  console.error("Email dispatch error:",error);
  return false;

 }
}


/* SEND STATUS EMAIL */

async function notifyDepositStatus(requestId,event,adminNote=""){

 try{

  const snap=await getDoc(doc(db,"deposits",requestId));

  if(!snap.exists()){
   console.error("Deposit not found for email:",requestId);
   return false;
  }

  return await sendDepositEmail(
   requestId,
   event,
   snap.data(),
   adminNote
  );

 }catch(error){

  console.error("Notification error:",error);
  return false;

 }

}


/* ADMIN AUTHENTICATION */

onAuthStateChanged(auth,async(user)=>{

 adminReady=false;

 if(!user){
  location.href="admin-login.html";
  return;
 }

 try{

  const uSnap=await getDoc(doc(db,"users",user.uid));

  if(!uSnap.exists()||uSnap.data().role!=="admin"){

   alert("Access denied");

   await signOut(auth);

   location.href="admin-login.html";
   return;

  }

  adminReady=true;

  await Promise.all([
   loadDeposits(),
   loadWithdraws(),
   loadReferrals(),
   loadSmsBadge()
  ]);

 }catch(error){

  console.error("Admin authentication error:",error);

  alert("Admin verification failed. Please check Firebase Rules.");

  await signOut(auth);

  location.href="admin-login.html";

 }

});


/* NAVIGATION */

window.openUserView=()=>{
 location.href="admin-user-view.html";
};

window.openInbox=()=>{
 location.href="admin-user-details.html";
};


/* SMS BADGE */

async function loadSmsBadge(){

 try{

  const q=query(
   collection(db,"chats"),
   where("unreadByAdmin","==",true)
  );

  const snap=await getDocs(q);

  const badge=document.getElementById("smsBadge");

  if(snap.size>0){

   badge.style.display="inline-block";
   badge.innerText=snap.size;

  }else{

   badge.style.display="none";

  }

 }catch(error){

  console.error("SMS badge error:",error);

 }

}


/* LOAD DEPOSITS */

async function loadDeposits(){

 const list=document.getElementById("depositList");

 list.innerHTML="Loading...";

 try{

  const q=query(
   collection(db,"deposits"),
   where("status","==","pending")
  );

  const snap=await getDocs(q);

  document.getElementById("depositNumber").innerText=snap.size;

  if(snap.empty){

   list.innerHTML="No pending deposits";
   return;

  }

  list.innerHTML="";

  for(const d of snap.docs){

   const x=d.data();

   let user={};

   if(x.uid){

    const uSnap=await getDoc(doc(db,"users",x.uid));

    if(uSnap.exists()){
     user=uSnap.data();
    }

   }

   const customerName=x.customerName||user.name||"N/A";

   const customerPhone=x.customerPhone||user.phone||"N/A";

   const balance=Number(user.balance)||0;

   const item=document.createElement("div");

   item.className="item";

   item.innerHTML=`

    <b>Customer Name:</b> ${escapeHTML(customerName)}<br>

    <b>Phone:</b> ${escapeHTML(customerPhone)}<br>

    <b>Customer UID:</b> ${escapeHTML(x.uid||"N/A")}<br>

    <b>Balance:</b> ${escapeHTML(balance)}<br>

    <b>Amount:</b> ${escapeHTML(x.amount??"N/A")}<br>

    <b>Method:</b> ${escapeHTML(x.method||"N/A")}<br>

    <b>Transaction ID:</b>
    <span class="trx">${escapeHTML(x.trxId||x.transactionId||"N/A")}</span><br>

    <b>Request ID:</b> ${escapeHTML(d.id)}

    <div class="row">

     <button class="approve" type="button">Approve</button>

     <button class="reject" type="button">Reject</button>

    </div>
   `;

   item.querySelector(".approve").addEventListener(
    "click",()=>approveDeposit(d.id)
   );

   item.querySelector(".reject").addEventListener(
    "click",()=>rejectDeposit(d.id)
   );

   list.appendChild(item);

  }

 }catch(error){

  console.error("Load deposits error:",error);

  list.innerHTML="Unable to load deposits. Check Firestore Rules.";

 }

}


/* LOAD WITHDRAWS */

async function loadWithdraws(){

 const list=document.getElementById("withdrawList");

 list.innerHTML="Loading...";

 try{

  const q=query(
   collection(db,"withdraws"),
   where("status","==","pending")
  );

  const snap=await getDocs(q);

  document.getElementById("withdrawNumber").innerText=snap.size;

  if(snap.empty){

   list.innerHTML="No pending withdraws";
   return;

  }

  list.innerHTML="";

  for(const d of snap.docs){

   const x=d.data();

   const uSnap=x.uid
    ?await getDoc(doc(db,"users",x.uid))
    :null;

   const user=uSnap?.exists()?uSnap.data():{};

   const submittedPhone=
    x.customerPhone||x.withdrawPhone||x.phone||x.number||"N/A";

   const item=document.createElement("div");

   item.className="item";

   item.innerHTML=`

    <b>Phone:</b> ${escapeHTML(user.phone||"N/A")}<br>

    <b>Balance:</b> ${escapeHTML(Number(user.balance)||0)}<br>

    <b>Amount:</b> ${escapeHTML(x.amount??"N/A")}<br>

    <b>Method:</b> ${escapeHTML(x.method||"N/A")}<br>

    <b>Submitted Phone:</b> ${escapeHTML(submittedPhone)}<br>

    <div class="row">

     <button class="approve" type="button">Approve</button>

     <button class="reject" type="button">Reject</button>

    </div>
   `;

   item.querySelector(".approve").addEventListener(
    "click",()=>approveWithdraw(d.id)
   );

   item.querySelector(".reject").addEventListener(
    "click",()=>rejectWithdraw(d.id)
   );

   list.appendChild(item);

  }

 }catch(error){

  console.error("Load withdraws error:",error);

  list.innerHTML="Unable to load withdraws.";

 }

}


/* LOAD REFERRALS */

async function loadReferrals(){

 const list=document.getElementById("referralList");

 list.innerHTML="Loading...";

 try{

  const q=query(
   collection(db,"referrals"),
   where("bonusGiven","==",false)
  );

  const snap=await getDocs(q);

  // Rejected referrals are not pending.
  const pendingDocs=snap.docs.filter(
   d=>!d.data().rejectedAt
  );

  document.getElementById("referralNumber").innerText=
   pendingDocs.length;

  if(pendingDocs.length===0){

   list.innerHTML="No pending referrals";
   return;

  }

  list.innerHTML="";

  for(const d of pendingDocs){

   const x=d.data();

   const item=document.createElement("div");

   item.className="item";

   item.innerHTML=`

    <b>Refer Phone Number:</b>
    ${escapeHTML(x.referrerPhone||"N/A")}<br>

    <b>New User Phone:</b>
    ${escapeHTML(x.newUserPhone||"N/A")}<br>

    <div class="row">

     <button class="approve" type="button">Approve</button>

     <button class="reject" type="button">Reject</button>

    </div>
   `;

   item.querySelector(".approve").addEventListener(
    "click",()=>approveReferral(d.id)
   );

   item.querySelector(".reject").addEventListener(
    "click",()=>rejectReferral(d.id)
   );

   list.appendChild(item);

  }

 }catch(error){

  console.error("Load referrals error:",error);

  list.innerHTML="Unable to load referrals.";

 }

}


/* APPROVE DEPOSIT */

window.approveDeposit=async(id)=>{

 if(!adminReady)return;

 if(!confirm(
  "Approve this deposit and add the amount to customer balance?"
 ))return;

 try{

  const depositRef=doc(db,"deposits",id);

  await runTransaction(db,async(transaction)=>{

   const depositSnap=await transaction.get(depositRef);

   if(!depositSnap.exists()){
    throw new Error("Deposit request not found.");
   }

   const d=depositSnap.data();

   if(d.status!=="pending"){
    throw new Error("This deposit has already been processed.");
   }

   if(!d.uid){
    throw new Error("Customer UID is missing.");
   }

   const amount=Number(d.amount);

   if(!Number.isFinite(amount)||amount<=0){
    throw new Error("Invalid deposit amount.");
   }

   const userRef=doc(db,"users",d.uid);

   const userSnap=await transaction.get(userRef);

   if(!userSnap.exists()){
    throw new Error("Customer account not found.");
   }

   const currentBalance=Number(userSnap.data().balance)||0;

   transaction.update(depositRef,{
    status:"approved",
    approvedAt:serverTimestamp()
   });

   transaction.update(userRef,{
    balance:currentBalance+amount
   });

  });

  const adminNote=prompt(
   "Optional approval note:"
  )||"";

  const sent=await notifyDepositStatus(
   id,
   "approved",
   adminNote
  );

  alert(
   sent
   ? "Deposit approved. Email notification request dispatched."
   : "Deposit approved, but email request could not be dispatched."
  );

  await loadDeposits();

 }catch(error){

  showActionError(error);

  await loadDeposits();

 }

};


/* REJECT DEPOSIT */

window.rejectDeposit=async(id)=>{

 if(!adminReady)return;

 if(!confirm("Are you sure you want to reject this deposit?"))return;

 try{

  const ref=doc(db,"deposits",id);

  await runTransaction(db,async(transaction)=>{

   const snap=await transaction.get(ref);

   if(!snap.exists()){
    throw new Error("Deposit not found.");
   }

   if(snap.data().status!=="pending"){
    throw new Error("This deposit has already been processed.");
   }

   transaction.update(ref,{
    status:"rejected",
    rejectedAt:serverTimestamp()
   });

  });

  const adminNote=prompt(
   "Enter rejection reason (optional):"
  )||"";

  const sent=await notifyDepositStatus(
   id,
   "rejected",
   adminNote
  );

  alert(
   sent
   ? "Deposit rejected. Email notification request dispatched."
   : "Deposit rejected, but email request could not be dispatched."
  );

  await loadDeposits();

 }catch(error){

  showActionError(error);

  await loadDeposits();

 }

};


/* APPROVE WITHDRAW */

window.approveWithdraw=async(id)=>{

 if(!adminReady)return;

 if(!confirm(
  "Approve this withdrawal and deduct the amount from customer balance?"
 ))return;

 try{

  const withdrawRef=doc(db,"withdraws",id);

  await runTransaction(db,async(transaction)=>{

   const withdrawSnap=await transaction.get(withdrawRef);

   if(!withdrawSnap.exists()){
    throw new Error("Withdrawal request not found.");
   }

   const w=withdrawSnap.data();

   if(w.status!=="pending"){
    throw new Error("This withdrawal has already been processed.");
   }

   if(!w.uid){
    throw new Error("Customer UID is missing.");
   }

   const amount=Number(w.amount);

   if(!Number.isFinite(amount)||amount<=0){
    throw new Error("Invalid withdrawal amount.");
   }

   const userRef=doc(db,"users",w.uid);

   const userSnap=await transaction.get(userRef);

   if(!userSnap.exists()){
    throw new Error("Customer account not found.");
   }

   const currentBalance=Number(userSnap.data().balance)||0;

   if(currentBalance<amount){
    throw new Error("Insufficient customer balance.");
   }

   transaction.update(withdrawRef,{
    status:"approved",
    approvedAt:serverTimestamp()
   });

   transaction.update(userRef,{
    balance:currentBalance-amount
   });

  });

  alert("Withdrawal approved successfully.");

  await loadWithdraws();

 }catch(error){

  showActionError(error);

  await loadWithdraws();

 }

};


/* REJECT WITHDRAW */

window.rejectWithdraw=async(id)=>{

 if(!adminReady)return;

 if(!confirm("Are you sure you want to reject this withdrawal?"))return;

 try{

  const ref=doc(db,"withdraws",id);

  await runTransaction(db,async(transaction)=>{

   const snap=await transaction.get(ref);

   if(!snap.exists()){
    throw new Error("Withdrawal not found.");
   }

   if(snap.data().status!=="pending"){
    throw new Error("This withdrawal has already been processed.");
   }

   transaction.update(ref,{
    status:"rejected",
    rejectedAt:serverTimestamp()
   });

  });

  await loadWithdraws();

 }catch(error){

  showActionError(error);

  await loadWithdraws();

 }

};


/* APPROVE REFERRAL */

window.approveReferral=async(id)=>{

 if(!adminReady)return;

 if(!confirm("Approve this referral?"))return;

 try{

  const ref=doc(db,"referrals",id);

  await runTransaction(db,async(transaction)=>{

   const snap=await transaction.get(ref);

   if(!snap.exists()){
    throw new Error("Referral not found.");
   }

   const data=snap.data();

   if(data.bonusGiven===true||data.rejectedAt){
    throw new Error("This referral has already been processed.");
   }

   transaction.update(ref,{
    bonusGiven:true,
    approvedAt:serverTimestamp()
   });

  });

  await loadReferrals();

 }catch(error){

  showActionError(error);

  await loadReferrals();

 }

};


/* REJECT REFERRAL */

window.rejectReferral=async(id)=>{

 if(!adminReady)return;

 if(!confirm("Reject this referral?"))return;

 try{

  const ref=doc(db,"referrals",id);

  await runTransaction(db,async(transaction)=>{

   const snap=await transaction.get(ref);

   if(!snap.exists()){
    throw new Error("Referral not found.");
   }

   const data=snap.data();

   if(data.bonusGiven===true||data.rejectedAt){
    throw new Error("This referral has already been processed.");
   }

   transaction.update(ref,{
    bonusGiven:false,
    rejectedAt:serverTimestamp()
   });

  });

  await loadReferrals();

 }catch(error){

  showActionError(error);

  await loadReferrals();

 }

};


/* LOGOUT */

window.logout=async()=>{

 try{

  await signOut(auth);

  location.href="admin-login.html";

 }catch(error){

  showActionError(error);

 }

};

</script>
</body>
</html>
