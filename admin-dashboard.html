
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dolla Pulls | Admin Dashboard</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f6fa;
 font-size:10px;
}
.header{
 display:flex;
 justify-content:flex-end;
 gap:5px;
 padding:18px;
 background:#0b1a33;
 box-shadow:0 1px 4px #0005;
}
.header div{
 padding:12px 18px;
 border-radius:3px;
 cursor:pointer;
 font-weight:bold;
}
.details{background:#0dcaf0;color:#000;position:relative}
.view{background:#ffc107;color:#000}
.badge{
 position:absolute;
 top:-8px;
 right:-8px;
 background:#dc3545;
 color:white;
 padding:3px 5px;
 border-radius:50%;
}
.container{max-width:1200px;margin:auto;padding:8px}
.dashboard{display:flex;gap:8px;flex-wrap:wrap}
.card{
 flex:1;
 min-width:200px;
 background:#1a2a4d;
 color:white;
 padding:8px;
 border-radius:5px;
 box-shadow:0 1px 5px #0005;
 max-height:calc(100vh - 120px);
 overflow-y:auto;
}
h2{margin-top:0;color:#ffc107;font-size:11px}
.item{
 border-bottom:1px solid #3a4a6f;
 padding:6px 0;
 overflow-wrap:anywhere;
}
.row{display:flex;gap:5px;margin-top:5px}
button{
 flex:1;
 padding:6px;
 border:0;
 border-radius:3px;
 cursor:pointer;
 font-size:9px;
}
button:disabled{opacity:.5;cursor:not-allowed}
.approve{background:#198754;color:white}
.reject{background:#dc3545;color:white}
.footer{text-align:center;padding:8px}
.logout{
 background:#18f2c2;
 color:#000;
 padding:6px 15px;
 font-weight:bold;
}
.error{color:#ff7777}
@media(max-width:768px){
 .dashboard{flex-direction:column}
 .card{max-height:none}
}
</style>
</head>

<body>

<div class="header">
 <div class="details" onclick="openInbox()">
  📃 Details
  <span id="smsBadge" class="badge" hidden>0</span>
 </div>
 <div class="view" onclick="openUserView()">👁 View</div>
</div>

<div class="container">
 <div class="dashboard">

  <div class="card">
   <h2>Pending Deposits</h2>
   <div id="depositList">Loading...</div>
   <p><b>Total Pending Deposits:</b>
   <span id="depositNumber">0</span></p>
  </div>

  <div class="card">
   <h2>Pending Withdraws</h2>
   <div id="withdrawList">Loading...</div>
   <p><b>Total Pending Withdraws:</b>
   <span id="withdrawNumber">0</span></p>
  </div>

  <div class="card">
   <h2>Pending Referrals</h2>
   <div id="referralList">Loading...</div>
   <p><b>Total Pending Referrals:</b>
   <span id="referralNumber">0</span></p>
  </div>

 </div>
</div>

<div class="footer">
 <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 collection,
 query,
 where,
 getDocs,
 runTransaction,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const app=initializeApp({
 apiKey:"AIzaSyBCylzF69zBzqNQ88mLj7aEXUyLqu3rNT0",
 authDomain:"dolla-pulls.firebaseapp.com",
 projectId:"dolla-pulls",
 storageBucket:"dolla-pulls.firebasestorage.app",
 messagingSenderId:"952761946013",
 appId:"1:952761946013:web:72fe061231ee8951c0e974"
});

const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);


/* COLLECTION SETTINGS */

const settings={
 deposits:{
  list:"depositList",
  count:"depositNumber",
  empty:"No pending deposits"
 },
 withdraws:{
  list:"withdrawList",
  count:"withdrawNumber",
  empty:"No pending withdraws"
 },
 referrals:{
  list:"referralList",
  count:"referralNumber",
  empty:"No pending referrals"
 }
};


/* AUTH CHECK */

onAuthStateChanged(auth,async user=>{

 if(!user){
  location.href="admin-login.html";
  return;
 }

 try{

  const snap=await getDoc(doc(db,"users",user.uid));

  if(!snap.exists()||snap.data().role!=="admin"){
   alert("Access denied");
   await signOut(auth);
   location.href="admin-login.html";
   return;
  }

  await loadAll();
  await loadSmsBadge();

 }catch(error){
  console.error(error);
  alert("Admin verification failed: "+error.message);
 }

});


/* NAVIGATION */

window.openInbox=()=>{
 location.href="admin-user-details.html";
};

window.openUserView=()=>{
 location.href="admin-user-view.html";
};


/* SMS BADGE */

async function loadSmsBadge(){

 try{

  const q=query(
   collection(db,"chats"),
   where("unreadByAdmin","==",true)
  );

  const snap=await getDocs(q);
  const badge=$("smsBadge");

  badge.hidden=snap.empty;
  badge.textContent=snap.size;

 }catch(e){
  console.error("Badge Error:",e);
 }

}


/* LOAD ALL DATA */

async function loadAll(){

 await Promise.all([
  loadList("deposits"),
  loadList("withdraws"),
  loadList("referrals")
 ]);

}


/* HTML SAFE TEXT */

function safe(value){

 return String(value??"N/A").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 })[c]);

}


/* LOAD REQUESTS */

async function loadList(type){

 const config=settings[type];
 const list=$(config.list);

 list.textContent="Loading...";

 try{

  const field=type==="referrals"?"bonusGiven":"status";
  const value=type==="referrals"?false:"pending";

  const q=query(
   collection(db,type),
   where(field,"==",value)
  );

  const snap=await getDocs(q);

  $(config.count).textContent=snap.size;

  if(snap.empty){
   list.textContent=config.empty;
   return;
  }

  const html=await Promise.all(snap.docs.map(async d=>{

   const x=d.data();

   let content="";

   if(type==="referrals"){

    content=`
     <b>Refer Phone Number:</b> ${safe(x.referrerPhone)}<br>
     <b>New User Phone:</b> ${safe(x.newUserPhone)}
    `;

   }else{

    const u=await getDoc(doc(db,"users",x.uid));

    if(!u.exists())return "";

    const user=u.data();

    const phone=
     x.customerPhone||
     x.withdrawPhone||
     x.phone||
     x.number||
     "N/A";

    content=`
     <b>Phone:</b> ${safe(user.phone)}<br>
     <b>Balance:</b> ৳${Number(user.balance)||0}<br>
     <b>Amount:</b> ৳${safe(x.amount)}<br>
     <b>Method:</b> ${safe(x.method)}<br>
     <b>Submitted Phone:</b> ${safe(phone)}
    `;

   }

   return `
    <div class="item">
     ${content}

     <div class="row">
      <button class="approve"
       data-action="approve"
       data-type="${type}"
       data-id="${safe(d.id)}">
       Approve
      </button>

      <button class="reject"
       data-action="reject"
       data-type="${type}"
       data-id="${safe(d.id)}">
       Reject
      </button>
     </div>
    </div>
   `;

  }));

  list.innerHTML=html.join("")||config.empty;

 }catch(error){

  console.error("Load Error:",error);
  list.innerHTML='<span class="error">Failed to load data</span>';

 }

}


/* APPROVE AND REJECT */

document.addEventListener("click",async e=>{

 const btn=e.target.closest("button[data-action]");

 if(!btn)return;

 const action=btn.dataset.action;
 const type=btn.dataset.type;
 const id=btn.dataset.id;

 if(!settings[type]||!id)return;

 btn.disabled=true;

 try{

  const ref=doc(db,type,id);

  await runTransaction(db,async tx=>{

   // READ REQUEST FIRST

   const snap=await tx.get(ref);

   if(!snap.exists()){
    throw Error("Request not found");
   }

   const x=snap.data();

   if(type==="referrals"){

    if(x.bonusGiven!==false){
     throw Error("Referral already processed");
    }

    tx.update(ref,{
     bonusGiven:action==="approve",
     ...(action==="approve"
      ?{approvedAt:serverTimestamp()}
      :{
        rejectedAt:serverTimestamp(),
        rejected:true
       })
    });

    return;
   }


   // DEPOSIT AND WITHDRAW

   if(x.status!=="pending"){
    throw Error("Request already processed");
   }

   const userRef=doc(db,"users",x.uid);

   // READ USER BEFORE ANY WRITE

   const userSnap=await tx.get(userRef);

   if(!userSnap.exists()){
    throw Error("User account not found");
   }

   if(action==="approve"){

    const amount=Number(x.amount);
    const balance=Number(userSnap.data().balance);

    if(!Number.isFinite(amount)||amount<=0){
     throw Error("Invalid request amount");
    }

    if(!Number.isFinite(balance)||balance<0){
     throw Error("Invalid user balance");
    }

    if(type==="deposits"){

     tx.update(userRef,{
      balance:balance+amount
     });

    }

    if(type==="withdraws"){

     if(balance<amount){
      throw Error("Insufficient user balance");
     }

     tx.update(userRef,{
      balance:balance-amount
     });

    }

   }

   // UPDATE REQUEST STATUS

   tx.update(ref,{
    status:action==="approve"?"approved":"rejected",
    ...(action==="approve"
     ?{approvedAt:serverTimestamp()}
     :{rejectedAt:serverTimestamp()})
   });

  });


  alert(
   action==="approve"
   ?"Approved Successfully!"
   :"Rejected Successfully!"
  );

  await loadList(type);


 }catch(error){

  console.error("Transaction Error:",error);

  alert("Operation Failed: "+error.message);

 }finally{

  btn.disabled=false;

 }

});


/* LOGOUT */

window.logout=async()=>{

 try{
  await signOut(auth);
  location.href="admin-login.html";
 }catch(e){
  alert(e.message);
 }

};

</script>
</body>
</html>
