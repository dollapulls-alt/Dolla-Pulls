<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1a33">
<title>Dolla Pulls | Admin Dashboard</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f4f6fb;
 color:#18243a;
}
header{
 background:#0b1a33;
 color:white;
 padding:17px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}
header h2{font-size:18px;margin:0}
.header-actions{display:flex;gap:8px}
button{
 border:0;
 border-radius:7px;
 padding:10px 13px;
 cursor:pointer;
 font-weight:bold;
}
button:disabled{opacity:.5;cursor:not-allowed}
.logout{background:#ffc107;color:#111}
.refresh{background:#0dcaf0;color:#111}
.container{max-width:1100px;margin:auto;padding:16px}
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px;
 margin-bottom:16px;
}
.stat{
 background:white;
 border-radius:12px;
 padding:17px;
 box-shadow:0 2px 9px #0000000d;
}
.stat span{font-size:12px;color:#64748b}
.stat strong{display:block;font-size:26px;margin-top:8px}
.panel{
 background:white;
 border-radius:12px;
 padding:15px;
 box-shadow:0 2px 9px #0000000d;
}
.panel h3{margin:0 0 14px;font-size:16px}
.item{
 border:1px solid #e1e7f0;
 border-radius:10px;
 padding:14px;
 margin-bottom:12px;
 overflow-wrap:anywhere;
}
.item p{margin:7px 0;font-size:13px;line-height:1.5}
.item b{color:#334155}
.trx{color:#a16207;font-weight:bold}
.actions{display:flex;gap:9px;margin-top:12px}
.approve{background:#198754;color:white;flex:1}
.reject{background:#dc3545;color:white;flex:1}
.message{
 padding:12px;
 background:#eef2ff;
 border-radius:8px;
 font-size:13px;
 margin-bottom:12px;
}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.empty{text-align:center;padding:30px;color:#64748b}
footer{text-align:center;padding:20px;color:#64748b;font-size:12px}
@media(max-width:600px){
 .stats{grid-template-columns:1fr 1fr}
 .container{padding:10px}
 header{padding:13px}
 header h2{font-size:15px}
 .item{padding:11px}
}
</style>
</head>

<body>

<header>
 <h2>💎 Dolla Pulls Admin</h2>
 <div class="header-actions">
  <button class="refresh" id="refreshBtn">Refresh</button>
  <button class="logout" id="logoutBtn">Logout</button>
 </div>
</header>

<main class="container">

 <div id="notice" class="message" hidden></div>

 <section class="stats">
  <div class="stat">
   <span>Pending Deposits</span>
   <strong id="pendingCount">0</strong>
  </div>
  <div class="stat">
   <span>Approved Today</span>
   <strong id="approvedCount">0</strong>
  </div>
  <div class="stat">
   <span>Rejected Today</span>
   <strong id="rejectedCount">0</strong>
  </div>
 </section>

 <section class="panel">
  <h3>📥 Pending Deposit Requests</h3>
  <div id="depositList">Loading deposits...</div>
 </section>

 <section class="panel" style="margin-top:15px">
  <h3>📋 Recent Processed Deposits</h3>
  <div id="historyList">Loading history...</div>
 </section>

</main>

<footer>Dolla Pulls Admin Dashboard</footer>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 collection,
 query,
 where,
 getDocs,
 serverTimestamp,
 runTransaction,
 orderBy,
 limit
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig={
 apiKey:"AIzaSyBCylzF69zBzqNQ88mLj7aEXUyLqu3rNT0",
 authDomain:"dolla-pulls.firebaseapp.com",
 projectId:"dolla-pulls",
 storageBucket:"dolla-pulls.firebasestorage.app",
 messagingSenderId:"952761946013",
 appId:"1:952761946013:web:72fe061231ee8951c0e974"
};


/* GOOGLE APPS SCRIPT */

const APPS_SCRIPT_URL=
"https://script.google.com/macros/s/AKfycbylHJqilASZY8-80d3rJodc0EKUu_iN4aJWugJHrOBdmHGUWRcNAvDP_3KwOoTs-dcH/exec";

/*
 IMPORTANT:
 This token is visible to browser users.
 For production, use a trusted server-side proxy.
*/

const EMAIL_SHARED_TOKEN=
"xg-2026-akyugfiuawgfjaeshf5jfh";


/* INITIALIZE */

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let adminReady=false;
let busyIds=new Set();


/* HELPERS */

const $=id=>document.getElementById(id);

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 })[c]);
}

function showNotice(message,type="success"){
 const box=$("notice");
 box.textContent=message;
 box.className="message "+type;
 box.hidden=false;
}

function hideNotice(){
 $("notice").hidden=true;
}


/* EMAIL NOTIFICATION */

async function sendStatusEmail(id,event,deposit,adminNote=""){

 if(!["approved","rejected"].includes(event)){
  return false;
 }

 const payload={
  secret:EMAIL_SHARED_TOKEN,
  event:event,
  requestId:id,
  customerName:deposit.customerName||"Customer",
  phone:deposit.customerPhone||deposit.phone||"",
  amount:deposit.amount??"",
  method:deposit.method||"",
  transactionId:deposit.trxId||deposit.transactionId||"",
  adminNote:adminNote
 };

 try{

  const response=await fetch(APPS_SCRIPT_URL,{
   method:"POST",
   headers:{
    "Content-Type":"text/plain;charset=utf-8"
   },
   body:JSON.stringify(payload),
   mode:"cors"
  });

  const result=await response.json();

  if(!result.success){
   console.error("Email API error:",result);
   return false;
  }

  return true;

 }catch(error){

  console.error("Email notification error:",error);
  return false;

 }
}


/* AUTHENTICATION */

onAuthStateChanged(auth,async user=>{

 adminReady=false;

 if(!user){
  location.href="admin-login.html";
  return;
 }

 try{

  const userSnap=await getDoc(doc(db,"users",user.uid));

  if(!userSnap.exists()||userSnap.data().role!=="admin"){
   alert("Access denied");
   await signOut(auth);
   location.href="admin-login.html";
   return;
  }

  adminReady=true;
  await loadDashboard();

 }catch(error){

  console.error(error);
  alert("Admin verification failed. Check Firebase Rules.");
  await signOut(auth);
  location.href="admin-login.html";

 }

});


/* LOAD DASHBOARD */

async function loadDashboard(){

 if(!adminReady)return;

 hideNotice();

 $("depositList").textContent="Loading...";
 $("historyList").textContent="Loading...";

 await Promise.all([
  loadPending(),
  loadHistory()
 ]);

}


/* LOAD PENDING DEPOSITS */

async function loadPending(){

 const list=$("depositList");

 try{

  const q=query(
   collection(db,"deposits"),
   where("status","==","pending")
  );

  const snap=await getDocs(q);

  $("pendingCount").textContent=snap.size;

  if(snap.empty){
   list.innerHTML='<div class="empty">No pending deposits</div>';
   return;
  }

  list.innerHTML="";

  for(const d of snap.docs){

   const x=d.data();

   let profile={};

   if(x.uid){
    const userSnap=await getDoc(doc(db,"users",x.uid));
    if(userSnap.exists())profile=userSnap.data();
   }

   const name=x.customerName||profile.name||"N/A";
   const phone=x.customerPhone||profile.phone||"N/A";

   const item=document.createElement("div");
   item.className="item";

   item.innerHTML=`
    <p><b>Customer:</b> ${escapeHTML(name)}</p>
    <p><b>Phone:</b> ${escapeHTML(phone)}</p>
    <p><b>UID:</b> ${escapeHTML(x.uid||"N/A")}</p>
    <p><b>Amount:</b> $${escapeHTML(x.amount??"N/A")}</p>
    <p><b>Method:</b> ${escapeHTML(x.method||"N/A")}</p>
    <p><b>Transaction ID:</b>
     <span class="trx">${escapeHTML(x.trxId||x.transactionId||"N/A")}</span>
    </p>
    <p><b>Request ID:</b> ${escapeHTML(d.id)}</p>
    <p><b>Status:</b> PENDING</p>
    <div class="actions">
     <button class="approve">Approve</button>
     <button class="reject">Reject</button>
    </div>
   `;

   item.querySelector(".approve").onclick=()=>approveDeposit(d.id);
   item.querySelector(".reject").onclick=()=>rejectDeposit(d.id);

   list.appendChild(item);

  }

 }catch(error){

  console.error(error);
  list.textContent="Unable to load deposits. Check Firestore Rules.";

 }

}


/* APPROVE DEPOSIT */

async function approveDeposit(id){

 if(!adminReady||busyIds.has(id))return;

 if(!confirm("Approve this deposit and add balance?"))return;

 busyIds.add(id);
 hideNotice();

 try{

  const depositRef=doc(db,"deposits",id);
  let emailData;

  await runTransaction(db,async transaction=>{

   const depositSnap=await transaction.get(depositRef);

   if(!depositSnap.exists()){
    throw new Error("Deposit not found");
   }

   const d=depositSnap.data();

   if(d.status!=="pending"){
    throw new Error("Already processed");
   }

   if(!d.uid){
    throw new Error("Customer UID missing");
   }

   const amount=Number(d.amount);

   if(!Number.isFinite(amount)||amount<=0){
    throw new Error("Invalid amount");
   }

   const userRef=doc(db,"users",d.uid);
   const userSnap=await transaction.get(userRef);

   if(!userSnap.exists()){
    throw new Error("Customer account not found");
   }

   const balance=Number(userSnap.data().balance)||0;

   emailData={
    ...d,
    customerName:d.customerName||userSnap.data().name||"Customer",
    customerPhone:d.customerPhone||userSnap.data().phone||""
   };

   transaction.update(depositRef,{
    status:"approved",
    approvedAt:serverTimestamp()
   });

   transaction.update(userRef,{
    balance:balance+amount
   });

  });

  const note=prompt("Optional approval note:")||"";

  const sent=await sendStatusEmail(
   id,"approved",emailData,note
  );

  showNotice(
   sent
    ?"Deposit approved. Email API confirmed success."
    :"Deposit approved, but email could not be confirmed.",
   sent?"success":"error"
  );

 }catch(error){

  console.error(error);
  showNotice(error.message||"Approval failed","error");

 }finally{

  busyIds.delete(id);
  await loadDashboard();

 }

}


/* REJECT DEPOSIT */

async function rejectDeposit(id){

 if(!adminReady||busyIds.has(id))return;

 if(!confirm("Reject this deposit?"))return;

 busyIds.add(id);
 hideNotice();

 try{

  const depositRef=doc(db,"deposits",id);
  let emailData;

  await runTransaction(db,async transaction=>{

   const snap=await transaction.get(depositRef);

   if(!snap.exists()){
    throw new Error("Deposit not found");
   }

   const d=snap.data();

   if(d.status!=="pending"){
    throw new Error("Already processed");
   }

   let profile={};

   if(d.uid){
    const userRef=doc(db,"users",d.uid);
    const userSnap=await transaction.get(userRef);
    if(userSnap.exists())profile=userSnap.data();
   }

   emailData={
    ...d,
    customerName:d.customerName||profile.name||"Customer",
    customerPhone:d.customerPhone||profile.phone||""
   };

   transaction.update(depositRef,{
    status:"rejected",
    rejectedAt:serverTimestamp()
   });

  });

  const note=prompt("Enter rejection reason (optional):")||"";

  const sent=await sendStatusEmail(
   id,"rejected",emailData,note
  );

  showNotice(
   sent
    ?"Deposit rejected. Email API confirmed success."
    :"Deposit rejected, but email could not be confirmed.",
   sent?"success":"error"
  );

 }catch(error){

  console.error(error);
  showNotice(error.message||"Rejection failed","error");

 }finally{

  busyIds.delete(id);
  await loadDashboard();

 }

}


/* LOAD RECENT HISTORY */

async function loadHistory(){

 const list=$("historyList");

 try{

  const q=query(
   collection(db,"deposits"),
   where("status","in",["approved","rejected"]),
   orderBy("createdAt","desc"),
   limit(30)
  );

  const snap=await getDocs(q);

  let approved=0;
  let rejected=0;

  const today=new Date();
  today.setHours(0,0,0,0);

  list.innerHTML="";

  if(snap.empty){
   list.innerHTML='<div class="empty">No processed deposits</div>';
  }

  snap.forEach(d=>{

   const x=d.data();

   const date=x.approvedAt||x.rejectedAt||x.createdAt;
   const dateObj=date?.toDate?.();

   if(dateObj&&dateObj>=today){
    if(x.status==="approved")approved++;
    if(x.status==="rejected")rejected++;
   }

   const item=document.createElement("div");
   item.className="item";

   item.innerHTML=`
    <p><b>Request ID:</b> ${escapeHTML(d.id)}</p>
    <p><b>Amount:</b> $${escapeHTML(x.amount??"N/A")}</p>
    <p><b>Method:</b> ${escapeHTML(x.method||"N/A")}</p>
    <p><b>Status:</b> ${escapeHTML(x.status.toUpperCase())}</p>
    <p><b>Date:</b> ${dateObj?escapeHTML(dateObj.toLocaleString()):"N/A"}</p>
   `;

   list.appendChild(item);

  });

  $("approvedCount").textContent=approved;
  $("rejectedCount").textContent=rejected;

 }catch(error){

  console.error("History error:",error);
  list.textContent="Unable to load history. Check Firestore indexes and Rules.";

 }

}


/* BUTTONS */

$("refreshBtn").addEventListener("click",loadDashboard);

$("logoutBtn").addEventListener("click",async()=>{

 try{
  await signOut(auth);
  location.href="admin-login.html";
 }catch(error){
  alert(error.message);
 }

});

</script>
</body>
</html>
