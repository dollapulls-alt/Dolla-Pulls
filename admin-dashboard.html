<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Dolla Pulls | Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f6fa;
 font-size:10px;
}

.header{
 display:flex;
 justify-content:flex-end;
 align-items:center;
 padding:18px 26px;
 background:#0b1a33;
 box-shadow:0 1px 4px rgba(0,0,0,.5);
 font-size:10px;
}

.view-icon{
 padding:12px 20px;
 background:#ffc107;
 color:#000;
 border-radius:3px;
 font-size:9px;
 cursor:pointer;
 font-weight:bold;
 margin-left:4px;
}

.sms-icon{
 padding:12px 20px;
 background:#0dcaf0;
 color:#000;
 border-radius:3px;
 cursor:pointer;
 font-size:9px;
 font-weight:bold;
 position:relative;
}

.sms-badge{
 position:absolute;
 top:-8px;
 right:-8px;
 background:#dc3545;
 color:#fff;
 font-size:8px;
 padding:2px 4px;
 border-radius:50%;
 font-weight:bold;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:8px;
}

.dashboard{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}

.card{
 flex:1;
 min-width:200px;
 background:#1a2a4d;
 padding:8px;
 border-radius:5px;
 box-shadow:0 1px 5px rgba(0,0,0,.5);
 font-size:10px;
 color:#fff;
 max-height:calc(100vh - 120px);
 overflow-y:auto;
}

.card h2{
 margin-top:0;
 color:#ffc107;
 font-size:11px;
}

.item{
 border-bottom:1px solid #3a4a6f;
 padding:7px 0;
 overflow-wrap:anywhere;
 line-height:1.6;
}

.item b{
 color:#ffc107;
}

.row{
 display:flex;
 gap:4px;
 margin-top:7px;
}

button{
 flex:1;
 padding:6px;
 border:none;
 border-radius:3px;
 cursor:pointer;
 color:#fff;
 font-size:9px;
}

button:disabled{
 opacity:.5;
 cursor:not-allowed;
}

.approve{background:#198754}
.reject{background:#dc3545}

.pending-status{
 color:#ffc107;
 font-weight:bold;
}

.empty{
 color:#cbd5e1;
 padding:8px 0;
}

.footer{
 padding:6px;
 text-align:center;
}

.logout{
 background:#18f2c2;
 color:#000;
 border:none;
 padding:4px 10px;
 border-radius:4px;
 cursor:pointer;
 font-size:10px;
 font-weight:bold;
}

.notice{
 display:none;
 padding:10px;
 margin:8px;
 background:#fff3cd;
 color:#664d03;
 border-radius:5px;
 font-size:11px;
}

@media(max-width:768px){
 .dashboard{flex-direction:column}
 .card{max-height:none}
}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

 <div class="sms-icon" onclick="openInbox()">
  📃 Details
  <span id="smsBadge" class="sms-badge"
   style="display:none;">0</span>
 </div>

 <div class="view-icon" onclick="openUserView()">
  👁 View
 </div>

</div>

<div id="notice" class="notice"></div>

<!-- CONTENT -->

<div class="container">

 <div class="dashboard">

  <!-- DEPOSITS -->

  <div class="card">

   <h2>Pending Deposits</h2>

   <div id="depositList">Loading...</div>

   <p>
    <b>Total Pending Deposits:</b>
    <span id="depositNumber">0</span>
   </p>

  </div>


  <!-- WITHDRAWS -->

  <div class="card">

   <h2>Pending Withdraws</h2>

   <div id="withdrawList">Loading...</div>

   <p>
    <b>Total Pending Withdraws:</b>
    <span id="withdrawNumber">0</span>
   </p>

  </div>


  <!-- REFERRALS -->

  <div class="card">

   <h2>Pending Referrals</h2>

   <div id="referralList">Loading...</div>

   <p>
    <b>Total Pending Referrals:</b>
    <span id="referralNumber">0</span>
   </p>

  </div>

 </div>

</div>


<!-- LOGOUT -->

<div class="footer">

 <button class="logout" onclick="logout()">
  Logout
 </button>

</div>


<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import {
 getAuth,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 collection,
 query,
 where,
 getDocs,
 runTransaction,
 increment,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIGURATION
========================================= */

const firebaseConfig={

 apiKey:"AIzaSyBCylzF69zBzqNQ88mLj7aEXUyLqu3rNT0",

 authDomain:"dolla-pulls.firebaseapp.com",

 projectId:"dolla-pulls",

 storageBucket:"dolla-pulls.firebasestorage.app",

 messagingSenderId:"952761946013",

 appId:"1:952761946013:web:72fe061231ee8951c0e974"

};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* =========================================
   GLOBAL VARIABLES
========================================= */

let currentAdmin=null;
let actionBusy=false;


/* =========================================
   SAFE HTML
========================================= */

function escapeHTML(value){

 return String(value??"").replace(/[&<>"']/g,char=>({

  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"

 })[char]);

}


/* =========================================
   NOTIFICATION
========================================= */

function showNotice(message){

 const el=document.getElementById("notice");

 el.textContent=message;
 el.style.display="block";

 setTimeout(()=>{

  el.style.display="none";

 },5000);

}


/* =========================================
   AUTH CHECK
========================================= */

onAuthStateChanged(auth,async user=>{

 if(!user){

  location.href="admin-login.html";
  return;

 }

 try{

  const uSnap=await getDoc(
   doc(db,"users",user.uid)
  );

  if(
   !uSnap.exists()||
   uSnap.data().role!=="admin"
  ){

   alert("Access denied");

   await signOut(auth);

   location.href="admin-login.html";

   return;

  }

  currentAdmin=user;

  loadDeposits();
  loadWithdraws();
  loadReferrals();
  loadSmsBadge();

 }catch(error){

  console.error("Admin authentication error:",error);

  alert("Admin verification failed.");

  await signOut(auth);

  location.href="admin-login.html";

 }

});


/* =========================================
   NAVIGATION
========================================= */

window.openUserView=()=>{

 location.href="admin-user-view.html";

};

window.openInbox=()=>{

 location.href="admin-user-details.html";

};


/* =========================================
   LOAD SMS BADGE
========================================= */

async function loadSmsBadge(){

 try{

  const q=query(

   collection(db,"chats"),

   where("unreadByAdmin","==",true)

  );

  const snap=await getDocs(q);

  const badge=document.getElementById("smsBadge");

  if(snap.size>0){

   badge.style.display="inline-block";

   badge.innerText=snap.size;

  }else{

   badge.style.display="none";

  }

 }catch(error){

  console.error("SMS badge error:",error);

 }

}


/* =========================================
   LOAD DEPOSITS
========================================= */

async function loadDeposits(){

 const list=document.getElementById("depositList");

 list.innerHTML="Loading...";

 try{

  const q=query(

   collection(db,"deposits"),

   where("status","==","pending")

  );

  const snap=await getDocs(q);

  document.getElementById("depositNumber").innerText=snap.size;

  if(snap.empty){

   list.innerHTML='<div class="empty">No pending deposits</div>';

   return;

  }

  list.innerHTML="";

  for(const d of snap.docs){

   const x=d.data();

   let user={};

   if(x.uid){

    const uSnap=await getDoc(
     doc(db,"users",x.uid)
    );

    if(uSnap.exists()){

     user=uSnap.data();

    }

   }

   const customerName=
    x.customerName||
    user.name||
    "Customer";

   const customerPhone=
    x.customerPhone||
    user.phone||
    "N/A";

   const transactionId=
    x.trxId||
    x.transactionId||
    "N/A";

   const amount=Number(x.amount||0);

   const item=document.createElement("div");

   item.className="item";

   item.innerHTML=`

    <b>STATUS:</b>
    <span class="pending-status">PENDING</span>
    <br>

    <b>Customer Name:</b>
    ${escapeHTML(customerName)}
    <br>

    <b>Phone:</b>
    ${escapeHTML(customerPhone)}
    <br>

    <b>UID:</b>
    ${escapeHTML(x.uid||"N/A")}
    <br>

    <b>Balance:</b>
    ৳${escapeHTML(user.balance||0)}
    <br>

    <b>Amount:</b>
    $${escapeHTML(x.amount??0)}
    <br>

    <b>Payment Method:</b>
    ${escapeHTML(x.method||"N/A")}
    <br>

    <b>Transaction ID:</b>
    ${escapeHTML(transactionId)}
    <br>

    <b>Request ID:</b>
    ${escapeHTML(d.id)}
    <br>

    <b>Submitted:</b>
    ${escapeHTML(
     x.createdAt?.toDate?.().toLocaleString()||"N/A"
    )}

    <div class="row">

     <button class="approve">
      Approve
     </button>

     <button class="reject">
      Reject
     </button>

    </div>

   `;

   const buttons=item.querySelectorAll("button");

   buttons[0].addEventListener("click",()=>{

    approveDeposit(d.id);

   });

   buttons[1].addEventListener("click",()=>{

    rejectDeposit(d.id);

   });

   list.appendChild(item);

  }

 }catch(error){

  console.error("Deposit loading error:",error);

  list.textContent="Unable to load deposits.";

 }

}


/* =========================================
   LOAD WITHDRAWS
========================================= */

async function loadWithdraws(){

 const list=document.getElementById("withdrawList");

 list.innerHTML="Loading...";

 try{

  const q=query(

   collection(db,"withdraws"),

   where("status","==","pending")

  );

  const snap=await getDocs(q);

  document.getElementById("withdrawNumber").innerText=snap.size;

  if(snap.empty){

   list.innerHTML='<div class="empty">No pending withdraws</div>';

   return;

  }

  list.innerHTML="";

  for(const d of snap.docs){

   const x=d.data();

   const uSnap=x.uid
    ?await getDoc(doc(db,"users",x.uid))
    :null;

   const user=uSnap?.exists()?uSnap.data():{};

   const submittedPhone=
    x.customerPhone||
    x.withdrawPhone||
    x.phone||
    x.number||
    "N/A";

   const item=document.createElement("div");

   item.className="item";

   item.innerHTML=`

    <b>Phone:</b>
    ${escapeHTML(user.phone||"N/A")}
    <br>

    <b>Balance:</b>
    ৳${escapeHTML(user.balance||0)}
    <br>

    <b>Amount:</b>
    ৳${escapeHTML(x.amount??0)}
    <br>

    <b>Method:</b>
    ${escapeHTML(x.method||"N/A")}
    <br>

    <b>Submitted Phone:</b>
    ${escapeHTML(submittedPhone)}
    <br>

    <div class="row">

     <button class="approve">Approve</button>

     <button class="reject">Reject</button>

    </div>

   `;

   const buttons=item.querySelectorAll("button");

   buttons[0].addEventListener("click",()=>{

    approveWithdraw(d.id);

   });

   buttons[1].addEventListener("click",()=>{

    rejectWithdraw(d.id);

   });

   list.appendChild(item);

  }

 }catch(error){

  console.error("Withdraw loading error:",error);

  list.textContent="Unable to load withdraws.";

 }

}


/* =========================================
   LOAD REFERRALS
========================================= */

async function loadReferrals(){

 const list=document.getElementById("referralList");

 list.innerHTML="Loading...";

 try{

  const q=query(

   collection(db,"referrals"),

   where("bonusGiven","==",false)

  );

  const snap=await getDocs(q);

  document.getElementById("referralNumber").innerText=snap.size;

  if(snap.empty){

   list.innerHTML='<div class="empty">No pending referrals</div>';

   return;

  }

  list.innerHTML="";

  for(const d of snap.docs){

   const x=d.data();

   const item=document.createElement("div");

   item.className="item";

   item.innerHTML=`

    <b>Refer Phone Number:</b>
    ${escapeHTML(x.referrerPhone||"N/A")}
    <br>

    <b>New User Phone:</b>
    ${escapeHTML(x.newUserPhone||"N/A")}
    <br>

    <div class="row">

     <button class="approve">Approve</button>

     <button class="reject">Reject</button>

    </div>

   `;

   const buttons=item.querySelectorAll("button");

   buttons[0].addEventListener("click",()=>{

    approveReferral(d.id);

   });

   buttons[1].addEventListener("click",()=>{

    rejectReferral(d.id);

   });

   list.appendChild(item);

  }

 }catch(error){

  console.error("Referral loading error:",error);

  list.textContent="Unable to load referrals.";

 }

}


/* =========================================
   APPROVE DEPOSIT
========================================= */

window.approveDeposit=async(id)=>{

 if(actionBusy||!currentAdmin)return;

 if(!confirm("Approve this deposit?"))return;

 actionBusy=true;

 try{

  await runTransaction(db,async(transaction)=>{

   const ref=doc(db,"deposits",id);

   const snap=await transaction.get(ref);

   if(!snap.exists()){

    throw new Error("Deposit not found.");

   }

   const d=snap.data();

   if(d.status!=="pending"){

    throw new Error("This deposit is already processed.");

   }

   if(!d.uid){

    throw new Error("Customer UID missing.");

   }

   const amount=Number(d.amount);

   if(!Number.isFinite(amount)||amount<=0){

    throw new Error("Invalid deposit amount.");

   }

   const userRef=doc(db,"users",d.uid);

   const userSnap=await transaction.get(userRef);

   if(!userSnap.exists()){

    throw new Error("Customer account not found.");

   }

   transaction.update(ref,{

    status:"approved",

    approvedAt:serverTimestamp(),

    approvedBy:currentAdmin.uid

   });

   transaction.update(userRef,{

    balance:increment(amount)

   });

  });

  showNotice("Deposit approved successfully.");

  await loadDeposits();

 }catch(error){

  console.error(error);

  alert(error.message||"Deposit approval failed.");

 }finally{

  actionBusy=false;

 }

};


/* =========================================
   REJECT DEPOSIT
========================================= */

window.rejectDeposit=async(id)=>{

 if(actionBusy||!currentAdmin)return;

 if(!confirm("Reject this deposit?"))return;

 actionBusy=true;

 try{

  await runTransaction(db,async(transaction)=>{

   const ref=doc(db,"deposits",id);

   const snap=await transaction.get(ref);

   if(!snap.exists()){

    throw new Error("Deposit not found.");

   }

   if(snap.data().status!=="pending"){

    throw new Error("This deposit is already processed.");

   }

   transaction.update(ref,{

    status:"rejected",

    rejectedAt:serverTimestamp(),

    rejectedBy:currentAdmin.uid

   });

  });

  showNotice("Deposit rejected successfully.");

  await loadDeposits();

 }catch(error){

  console.error(error);

  alert(error.message||"Deposit rejection failed.");

 }finally{

  actionBusy=false;

 }

};


/* =========================================
   APPROVE WITHDRAW
========================================= */

window.approveWithdraw=async(id)=>{

 if(actionBusy||!currentAdmin)return;

 if(!confirm("Approve this withdraw?"))return;

 actionBusy=true;

 try{

  await runTransaction(db,async(transaction)=>{

   const ref=doc(db,"withdraws",id);

   const snap=await transaction.get(ref);

   if(!snap.exists()){

    throw new Error("Withdraw not found.");

   }

   const w=snap.data();

   if(w.status!=="pending"){

    throw new Error("This withdraw is already processed.");

   }

   if(!w.uid){

    throw new Error("Customer UID missing.");

   }

   const amount=Number(w.amount);

   if(!Number.isFinite(amount)||amount<=0){

    throw new Error("Invalid withdraw amount.");

   }

   const userRef=doc(db,"users",w.uid);

   const userSnap=await transaction.get(userRef);

   if(!userSnap.exists()){

    throw new Error("Customer account not found.");

   }

   const balance=Number(userSnap.data().balance||0);

   if(balance<amount){

    throw new Error("Insufficient customer balance.");

   }

   transaction.update(ref,{

    status:"approved",

    approvedAt:serverTimestamp(),

    approvedBy:currentAdmin.uid

   });

   transaction.update(userRef,{

    balance:increment(-amount)

   });

  });

  showNotice("Withdraw approved successfully.");

  await loadWithdraws();

 }catch(error){

  console.error(error);

  alert(error.message||"Withdraw approval failed.");

 }finally{

  actionBusy=false;

 }

};


/* =========================================
   REJECT WITHDRAW
========================================= */

window.rejectWithdraw=async(id)=>{

 if(actionBusy||!currentAdmin)return;

 if(!confirm("Reject this withdraw?"))return;

 actionBusy=true;

 try{

  await runTransaction(db,async(transaction)=>{

   const ref=doc(db,"withdraws",id);

   const snap=await transaction.get(ref);

   if(!snap.exists()){

    throw new Error("Withdraw not found.");

   }

   if(snap.data().status!=="pending"){

    throw new Error("This withdraw is already processed.");

   }

   transaction.update(ref,{

    status:"rejected",

    rejectedAt:serverTimestamp(),

    rejectedBy:currentAdmin.uid

   });

  });

  showNotice("Withdraw rejected successfully.");

  await loadWithdraws();

 }catch(error){

  console.error(error);

  alert(error.message||"Withdraw rejection failed.");

 }finally{

  actionBusy=false;

 }

};


/* =========================================
   APPROVE REFERRAL
========================================= */

window.approveReferral=async(id)=>{

 if(actionBusy||!currentAdmin)return;

 if(!confirm("Approve this referral?"))return;

 actionBusy=true;

 try{

  await runTransaction(db,async(transaction)=>{

   const ref=doc(db,"referrals",id);

   const snap=await transaction.get(ref);

   if(!snap.exists()){

    throw new Error("Referral not found.");

   }

   if(snap.data().bonusGiven!==false){

    throw new Error("Referral already processed.");

   }

   transaction.update(ref,{

    bonusGiven:true,

    approvedAt:serverTimestamp(),

    approvedBy:currentAdmin.uid

   });

  });

  showNotice("Referral approved successfully.");

  await loadReferrals();

 }catch(error){

  console.error(error);

  alert(error.message||"Referral approval failed.");

 }finally{

  actionBusy=false;

 }

};


/* =========================================
   REJECT REFERRAL
========================================= */

window.rejectReferral=async(id)=>{

 if(actionBusy||!currentAdmin)return;

 if(!confirm("Reject this referral?"))return;

 actionBusy=true;

 try{

  await runTransaction(db,async(transaction)=>{

   const ref=doc(db,"referrals",id);

   const snap=await transaction.get(ref);

   if(!snap.exists()){

    throw new Error("Referral not found.");

   }

   if(snap.data().bonusGiven!==false){

    throw new Error("Referral already processed.");

   }

   transaction.update(ref,{

    bonusGiven:false,

    rejectedAt:serverTimestamp(),

    rejectedBy:currentAdmin.uid

   });

  });

  showNotice("Referral rejected.");

  await loadReferrals();

 }catch(error){

  console.error(error);

  alert(error.message||"Referral rejection failed.");

 }finally{

  actionBusy=false;

 }

};


/* =========================================
   LOGOUT
========================================= */

window.logout=async()=>{

 if(!confirm("Are you sure you want to logout?"))return;

 try{

  await signOut(auth);

  location.href="admin-login.html";

 }catch(error){

  console.error(error);

  alert("Logout failed.");

 }

};

</script>

</body>
</html>
