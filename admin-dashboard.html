
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dolla Pulls | Admin Dashboard</title>

<style>
*{box-sizing:border-box}
body{margin:0;font:10px Arial;background:#f5f6fa}
.header{display:flex;justify-content:flex-end;gap:5px;padding:18px 15px;background:#0b1a33}
.header div{padding:12px 18px;border-radius:3px;cursor:pointer;font-weight:bold}
.details{background:#0dcaf0;color:#000;position:relative}
.view{background:#ffc107;color:#000}
.badge{position:absolute;top:-8px;right:-8px;background:red;color:white;padding:3px 5px;border-radius:50%}
.container{max-width:1200px;margin:auto;padding:8px}
.dashboard{display:flex;gap:8px;flex-wrap:wrap}
.card{flex:1;min-width:200px;background:#1a2a4d;color:white;padding:8px;border-radius:5px;max-height:calc(100vh - 120px);overflow:auto}
h2{color:#ffc107;font-size:11px;margin-top:0}
.item{border-bottom:1px solid #3a4a6f;padding:6px 0;overflow-wrap:anywhere}
.row{display:flex;gap:5px;margin-top:5px}
button{flex:1;padding:5px;border:0;border-radius:3px;cursor:pointer;font-size:9px}
.approve{background:#198754;color:white}
.reject{background:#dc3545;color:white}
.footer{text-align:center;padding:8px}
.logout{background:#18f2c2;padding:6px 15px;font-weight:bold}
@media(max-width:768px){
.dashboard{flex-direction:column}
.card{max-height:none}
}
</style>
</head>

<body>

<div class="header">
 <div class="details" onclick="openInbox()">
  📃 Details
  <span id="smsBadge" class="badge" hidden>0</span>
 </div>
 <div class="view" onclick="openUserView()">👁 View</div>
</div>

<div class="container">
 <div class="dashboard">

  <div class="card">
   <h2>Pending Deposits</h2>
   <div id="depositList">Loading...</div>
   <p><b>Total:</b> <span id="depositNumber">0</span></p>
  </div>

  <div class="card">
   <h2>Pending Withdraws</h2>
   <div id="withdrawList">Loading...</div>
   <p><b>Total:</b> <span id="withdrawNumber">0</span></p>
  </div>

  <div class="card">
   <h2>Pending Referrals</h2>
   <div id="referralList">Loading...</div>
   <p><b>Total:</b> <span id="referralNumber">0</span></p>
  </div>

 </div>
</div>

<div class="footer">
 <button class="logout" onclick="logout()">Logout</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import {
 getAuth,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

import {
 getFirestore,doc,getDoc,collection,query,where,
 getDocs,runTransaction,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const app=initializeApp({
 apiKey:"AIzaSyBCylzF69zBzqNQ88mLj7aEXUyLqu3rNT0",
 authDomain:"dolla-pulls.firebaseapp.com",
 projectId:"dolla-pulls",
 storageBucket:"dolla-pulls.firebasestorage.app",
 messagingSenderId:"952761946013",
 appId:"1:952761946013:web:72fe061231ee8951c0e974"
});

const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);

const configs={
 deposits:{list:"depositList",count:"depositNumber",title:"Deposit"},
 withdraws:{list:"withdrawList",count:"withdrawNumber",title:"Withdraw"},
 referrals:{list:"referralList",count:"referralNumber",title:"Referral"}
};

onAuthStateChanged(auth,async user=>{
 if(!user){
  location.href="admin-login.html";
  return;
 }

 try{
  const snap=await getDoc(doc(db,"users",user.uid));

  if(!snap.exists()||snap.data().role!=="admin"){
   alert("Access denied");
   await signOut(auth);
   location.href="admin-login.html";
   return;
  }

  loadAll();
  loadSmsBadge();

 }catch(e){
  console.error(e);
  alert("Authentication failed");
 }
});

window.openInbox=()=>location.href="admin-user-details.html";
window.openUserView=()=>location.href="admin-user-view.html";

async function loadSmsBadge(){
 try{
  const q=query(collection(db,"chats"),where("unreadByAdmin","==",true));
  const snap=await getDocs(q);
  $("smsBadge").hidden=!snap.size;
  $("smsBadge").textContent=snap.size;
 }catch(e){console.error(e)}
}

async function loadAll(){
 await Promise.all([
  loadList("deposits"),
  loadList("withdraws"),
  loadList("referrals")
 ]);
}

async function loadList(type){
 const c=configs[type],list=$(c.list);
 list.textContent="Loading...";

 try{
  const field=type==="referrals"?"bonusGiven":"status";
  const value=type==="referrals"?false:"pending";

  const snap=await getDocs(query(
   collection(db,type),where(field,"==",value)
  ));

  $(c.count).textContent=snap.size;

  if(snap.empty){
   list.textContent="No pending "+type;
   return;
  }

  const items=await Promise.all(snap.docs.map(async d=>{
   const x=d.data();
   let user={};

   if(type!=="referrals"){
    const u=await getDoc(doc(db,"users",x.uid));
    if(!u.exists())return "";
    user=u.data();
   }

   const phone=type==="referrals"
    ?`<b>Refer Phone:</b> ${escapeHTML(x.referrerPhone)}<br>
      <b>New User:</b> ${escapeHTML(x.newUserPhone)}`
    :`<b>Phone:</b> ${escapeHTML(user.phone)}<br>
      <b>Balance:</b> ৳${Number(user.balance)||0}<br>
      <b>Amount:</b> ৳${Number(x.amount)||0}<br>
      <b>Method:</b> ${escapeHTML(x.method)}<br>
      <b>Submitted Phone:</b> ${escapeHTML(x.customerPhone||x.withdrawPhone||x.phone||x.number||"N/A")}`;

   return `<div class="item">
    ${phone}
    <div class="row">
     <button class="approve" data-action="approve" data-type="${type}" data-id="${d.id}">Approve</button>
     <button class="reject" data-action="reject" data-type="${type}" data-id="${d.id}">Reject</button>
    </div>
   </div>`;
  }));

  list.innerHTML=items.join("")||"No pending "+type;

 }catch(e){
  console.error(e);
  list.textContent="Failed to load data";
 }
}

function escapeHTML(v){
 return String(v??"N/A").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

document.addEventListener("click",async e=>{
 const btn=e.target.closest("button[data-action]");
 if(!btn)return;

 const {action,type,id}=btn.dataset;
 btn.disabled=true;

 try{
  const ref=doc(db,type,id);

  await runTransaction(db,async tx=>{
   const snap=await tx.get(ref);
   if(!snap.exists())throw Error("Request not found");

   const x=snap.data();
   const userRef=type==="referrals"?null:doc(db,"users",x.uid);
   const userSnap=userRef?await tx.get(userRef):null;

   const pending=type==="referrals"
    ?x.bonusGiven===false
    :x.status==="pending";

   if(!pending)throw Error("Already processed");

   if(type==="deposits"&&action==="approve"){
    if(!userSnap.exists())throw Error("User not found");
    const amount=Number(x.amount);
    if(!Number.isFinite(amount)||amount<=0)throw Error("Invalid amount");

    tx.update(userRef,{balance:increment(amount)});
   }

   if(type==="withdraws"&&action==="approve"){
    if(!userSnap.exists())throw Error("User not found");
    const amount=Number(x.amount);
    const balance=Number(userSnap.data().balance)||0;

    if(!Number.isFinite(amount)||amount<=0||balance<amount)
     throw Error("Insufficient balance");

    tx.update(userRef,{balance:increment(-amount)});
   }

   if(type==="referrals"){
    tx.update(ref,{
     bonusGiven:action==="approve",
     ...(action==="approve"
      ?{approvedAt:serverTimestamp()}
      :{rejectedAt:serverTimestamp(),rejected:true})
    });
   }else{
    tx.update(ref,{
     status:action==="approve"?"approved":"rejected",
     ...(action==="approve"?{approvedAt:serverTimestamp()}: {})
    });
   }
  });

  alert("Successfully "+action+"d");
  await loadList(type);

 }catch(err){
  console.error(err);
  alert(err.message||"Operation failed");
  btn.disabled=false;
 }
});

window.logout=async()=>{
 await signOut(auth);
 location.href="admin-login.html";
};

</script>
</body>
</html>
