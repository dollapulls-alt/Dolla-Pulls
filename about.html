<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolla Pulls | Customer Support</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d031b;color:#fff;font-family:Arial,sans-serif}
header{padding:16px;background:#24113b;display:flex;align-items:center;justify-content:space-between}
header a{color:#fff;text-decoration:none}.wrap{max-width:650px;margin:18px auto;padding:12px}
.panel{background:#1b1030;border:1px solid #553b75;border-radius:16px;padding:14px;box-shadow:0 8px 24px #0006}
#messages{height:48vh;min-height:300px;overflow:auto;padding:10px;background:#10091d;border-radius:12px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 12px;margin:8px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.5}
.bot{background:#35234e;margin-right:auto}.customer{background:#5632a0;margin-left:auto}
.options{display:grid;grid-template-columns:1fr;gap:9px}
button{border:0;border-radius:10px;padding:13px;background:linear-gradient(135deg,#8754d8,#5531a0);color:#fff;font-weight:bold;font-size:14px;cursor:pointer}
button.sub{background:#304a75}button:disabled{opacity:.5}
.note{font-size:12px;color:#c9bddb;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<header><a href="index.html">← Dashboard</a><strong>Customer Support</strong><span id="status">Connecting…</span></header>
<div class="wrap"><div class="panel">
  <div id="messages" aria-live="polite"></div>
  <div class="options" id="mainOptions">
    <button data-action="credit">Credit নাম্বার প্রয়োজন</button>
    <button data-action="deposit">জমা কনফার্ম</button>
    <button data-action="withdraw">উত্তোলন কনফার্ম</button>
    <button data-action="about">অ্যাপ সম্পর্কে জানতে চাই</button>
    <button data-action="human">প্রতিনিধির সঙ্গে কথা বলতে চাই</button>
  </div>
  <div class="options" id="paymentOptions" hidden>
    <button class="sub" data-method="বিকাশ">বিকাশ</button>
    <button class="sub" data-method="নগদ">নগদ</button>
    <button class="sub" data-method="উপায়">উপায়</button>
    <button class="sub" data-method="সরাসরি ব্যাংক">সরাসরি ব্যাংক</button>
    <button data-action="back">← আগের মেনু</button>
  </div>
  <p class="note">এটি স্বয়ংক্রিয় সহায়তা ব্যবস্থা। কোনো জমা বা উত্তোলন সম্পন্ন হয়েছে কি না, তা লেনদেন যাচাইয়ের পর নিশ্চিত হবে।</p>
</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,addDoc,onSnapshot,serverTimestamp,updateDoc} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCylzF69zBzqNQ88mLj7aEXUyLqu3rNT0",
  authDomain: "dolla-pulls.firebaseapp.com",
  projectId: "dolla-pulls",
  storageBucket: "dolla-pulls.firebasestorage.app",
  messagingSenderId: "952761946013",
  appId: "1:952761946013:web:72fe061231ee8951c0e974"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const messagesEl=document.getElementById("messages"),statusEl=document.getElementById("status");
const mainOptions=document.getElementById("mainOptions"),paymentOptions=document.getElementById("paymentOptions");
let uid=null,chatRef=null,messagesRef=null,unsubscribe=null,busy=false;

function addBubble(text,kind){
  const div=document.createElement("div");div.className="msg "+kind;div.textContent=text;
  messagesEl.appendChild(div);messagesEl.scrollTop=messagesEl.scrollHeight;
}
async function sendMessage(text,kind="customer"){
  if(!uid||busy)return;busy=true;
  try{
    await addDoc(messagesRef,{text,sender:kind,senderUid:uid,createdAt:serverTimestamp()});
    await updateDoc(chatRef,{lastMessage:text,updatedAt:serverTimestamp(),unreadByAdmin:true});
  }catch(e){console.error(e);alert("মেসেজ পাঠানো যায়নি। Firebase Security Rules পরীক্ষা করুন।");}
  finally{busy=false;}
}
async function botReply(text){
  await addDoc(messagesRef,{text,sender:"bot",senderUid:"system",createdAt:serverTimestamp()});
  await updateDoc(chatRef,{lastMessage:text,updatedAt:serverTimestamp(),unreadByAdmin:true});
}
async function chooseMain(action){
  const labels={
    credit:"Credit নাম্বার প্রয়োজন",
    deposit:"জমা কনফার্ম",
    withdraw:"উত্তোলন কনফার্ম",
    about:"অ্যাপ সম্পর্কে জানতে চাই",
    human:"প্রতিনিধির সঙ্গে কথা বলতে চাই"
  };
  await sendMessage(labels[action]);
  if(action==="credit"){
    mainOptions.hidden=true;paymentOptions.hidden=false;
    await botReply("অনুগ্রহ করে আপনার পেমেন্ট পদ্ধতি নির্বাচন করুন।");
  }else if(action==="deposit"||action==="withdraw"){
    await botReply("আপনার কনফার্মেশন পেয়েছি। লেনদেন যাচাইয়ের পরই জমা/উত্তোলনের অবস্থা নিশ্চিত হবে।");
  }else if(action==="about"){
    await botReply("এটি একটি আয়ের সাইট।");
  }else if(action==="human"){
    await botReply("অনুগ্রহপূর্বক mail করুন।");
  }
}
async function chooseMethod(method){
  await sendMessage(method);
  mainOptions.hidden=false;paymentOptions.hidden=true;
  if(method==="সরাসরি ব্যাংক"){
    await botReply("বুথ থেকে cardless deposit করুন।\nAccount number: 17459614758");
  }else{
    await botReply(`${method} অ্যাপে Transfer Money নির্বাচন করুন, এরপর Visa Card নির্বাচন করে এই নম্বরটি ব্যবহার করুন:\nVisa Card number: 331256`);
  }
}
document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",async()=>{
  const a=b.dataset.action;if(a==="back"){paymentOptions.hidden=true;mainOptions.hidden=false;return;}
  await chooseMain(a);
}));
document.querySelectorAll("[data-method]").forEach(b=>b.addEventListener("click",()=>chooseMethod(b.dataset.method)));

onAuthStateChanged(auth,async user=>{
  if(!user){location.replace("index.html");return;}
  uid=user.uid;chatRef=doc(db,"chats",uid);messagesRef=collection(chatRef,"messages");
  try{
    const profile=await getDoc(doc(db,"users",uid));
    const name=profile.exists()?(profile.data().name||""):"";
    await setDoc(chatRef,{uid,name,phone:profile.exists()?(profile.data().phone||""):"",createdAt:serverTimestamp(),updatedAt:serverTimestamp(),unreadByAdmin:false,lastMessage:""},{merge:true});
    statusEl.textContent="Online";
    unsubscribe=onSnapshot(messagesRef,snap=>{
      messagesEl.innerHTML="";
      if(snap.empty)addBubble("স্বাগতম! নিচের একটি বিষয় নির্বাচন করুন।","bot");
      snap.docs.sort((a,b)=>(a.data().createdAt?.seconds||0)-(b.data().createdAt?.seconds||0)).forEach(d=>{
        const x=d.data();addBubble(x.text||"",x.sender==="customer"?"customer":"bot");
      });
      messagesEl.scrollTop=messagesEl.scrollHeight;
    },err=>{console.error(err);statusEl.textContent="Error";});
    await updateDoc(chatRef,{unreadByAdmin:false});
  }catch(e){console.error(e);statusEl.textContent="Setup error";alert("চ্যাট চালু হয়নি। Firebase Security Rules ও Firestore সেটআপ পরীক্ষা করুন।");}
});
</script>
</body></html>
