<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolla Pulls | Customer Support</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d031b;color:#fff;font-family:Arial,sans-serif}
header{padding:16px;background:#24113b;display:flex;align-items:center;justify-content:space-between;gap:8px}
header a{color:#fff;text-decoration:none}
.wrap{max-width:650px;margin:18px auto;padding:12px}
.panel{background:#1b1030;border:1px solid #553b75;border-radius:16px;padding:14px;box-shadow:0 8px 24px #0006}
#messages{height:48vh;min-height:300px;overflow:auto;padding:10px;background:#10091d;border-radius:12px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 12px;margin:8px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.5}
.bot{background:#35234e;margin-right:auto}
.customer{background:#5632a0;margin-left:auto}
.options{display:grid;grid-template-columns:1fr;gap:9px}
button{border:0;border-radius:10px;padding:13px;background:linear-gradient(135deg,#8754d8,#5531a0);color:#fff;font-weight:bold;font-size:14px;cursor:pointer}
button.sub{background:#304a75}
button:disabled{opacity:.5}
.note{font-size:12px;color:#c9bddb;line-height:1.5;margin-top:12px}
#errorBox{display:none;background:#5b1724;color:#fff;padding:10px;border-radius:8px;margin-bottom:10px;font-size:13px;white-space:pre-wrap}
#status{font-size:12px;color:#d7c7ed}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <a href="dashboard.html">← Dashboard</a>
  <strong>Customer Support</strong>
  <span id="status">Connecting…</span>
</header>

<div class="wrap">
  <div class="panel">
    <div id="errorBox" role="alert"></div>
    <div id="messages" aria-live="polite"></div>

    <div class="options" id="mainOptions">
      <button data-action="credit">Credit নাম্বার প্রয়োজন</button>
      <button data-action="deposit">জমা কনফার্ম</button>
      <button data-action="withdraw">উত্তোলন কনফার্ম</button>
      <button data-action="about">অ্যাপ সম্পর্কে জানতে চাই</button>
      <button data-action="human">প্রতিনিধির সঙ্গে কথা বলতে চাই</button>
    </div>

    <div class="options" id="paymentOptions" hidden>
      <button class="sub" data-method="বিকাশ">বিকাশ</button>
      <button class="sub" data-method="নগদ">নগদ</button>
      <button class="sub" data-method="উপায়">উপায়</button>
      <button class="sub" data-method="সরাসরি ব্যাংক">সরাসরি ব্যাংক</button>
      <button data-action="back">← আগের মেনু</button>
    </div>

    <p class="note">এটি স্বয়ংক্রিয় সহায়তা ব্যবস্থা। কোনো জমা বা উত্তোলন সম্পন্ন হয়েছে কি না, তা লেনদেন যাচাইয়ের পর নিশ্চিত হবে।</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, addDoc,
  onSnapshot, serverTimestamp, updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCylzF69zBzqNQ88mLj7aEXUyLqu3rNT0",
  authDomain: "dolla-pulls.firebaseapp.com",
  projectId: "dolla-pulls",
  storageBucket: "dolla-pulls.firebasestorage.app",
  messagingSenderId: "952761946013",
  appId: "1:952761946013:web:72fe061231ee8951c0e974"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const messagesEl = document.getElementById("messages");
const statusEl = document.getElementById("status");
const errorBox = document.getElementById("errorBox");
const mainOptions = document.getElementById("mainOptions");
const paymentOptions = document.getElementById("paymentOptions");

let uid = null;
let chatRef = null;
let messagesRef = null;
let busy = false;
let stopMessages = null;

function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = "block";
}
function clearError() {
  errorBox.textContent = "";
  errorBox.style.display = "none";
}
function addBubble(text, kind) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function friendlyError(error) {
  console.error(error);
  if (error?.code === "permission-denied") {
    return "Firestore Permission Denied: Firestore Rules ঠিকমতো প্রকাশ করা হয়নি, অথবা users/{uid} / chats access অনুমোদিত নয়।";
  }
  if (error?.code === "failed-precondition") {
    return "Firestore-এর কোনো query/index বা database সেটআপে সমস্যা হয়েছে।";
  }
  if (error?.code === "unavailable") {
    return "ইন্টারনেট বা Firebase সার্ভারে সংযোগ পাওয়া যাচ্ছে না।";
  }
  return "চ্যাট চালু হয়নি: " + (error?.message || "অজানা সমস্যা");
}

async function sendMessage(text, sender = "customer") {
  if (!uid || busy) return false;
  busy = true;
  clearError();
  try {
    await addDoc(messagesRef, {
      text,
      sender,
      senderUid: uid,
      createdAt: serverTimestamp()
    });
    await updateDoc(chatRef, {
      lastMessage: text,
      updatedAt: serverTimestamp(),
      unreadByAdmin: true
    });
    return true;
  } catch (error) {
    showError(friendlyError(error));
    return false;
  } finally {
    busy = false;
  }
}

async function botReply(text) {
  if (!uid) return;
  try {
    // Bot replies are stored under the authenticated customer's own chat.
    // The rules permit sender "bot" only when senderUid is this customer's UID.
    await addDoc(messagesRef, {
      text,
      sender: "bot",
      senderUid: uid,
      createdAt: serverTimestamp()
    });
    await updateDoc(chatRef, {
      lastMessage: text,
      updatedAt: serverTimestamp(),
      unreadByAdmin: true
    });
  } catch (error) {
    showError(friendlyError(error));
  }
}

async function chooseMain(action) {
  const labels = {
    credit: "Credit নাম্বার প্রয়োজন",
    deposit: "জমা কনফার্ম",
    withdraw: "উত্তোলন কনফার্ম",
    about: "অ্যাপ সম্পর্কে জানতে চাই",
    human: "প্রতিনিধির সঙ্গে কথা বলতে চাই"
  };

  const sent = await sendMessage(labels[action]);
  if (!sent) return;

  if (action === "credit") {
    mainOptions.hidden = true;
    paymentOptions.hidden = false;
    await botReply("অনুগ্রহ করে আপনার পেমেন্ট পদ্ধতি নির্বাচন করুন।");
  } else if (action === "deposit" || action === "withdraw") {
    await botReply("আপনার কনফার্মেশন পেয়েছি। লেনদেন যাচাইয়ের পরই জমা/উত্তোলনের অবস্থা নিশ্চিত হবে।");
  } else if (action === "about") {
    await botReply("এটি একটি আয়ের সাইট।");
  } else if (action === "human") {
    await botReply("অনুগ্রহপূর্বক mail করুন।");
  }
}

async function chooseMethod(method) {
  const sent = await sendMessage(method);
  if (!sent) return;

  mainOptions.hidden = false;
  paymentOptions.hidden = true;

  if (method === "সরাসরি ব্যাংক") {
    await botReply("বুথ থেকে cardless deposit করুন।\nAccount number: 17459614758");
  } else {
    await botReply(`${method} অ্যাপে Transfer Money নির্বাচন করুন, এরপর Visa Card নির্বাচন করে এই নম্বরটি ব্যবহার করুন:\nVisa Card number: 331256`);
  }
}

document.querySelectorAll("[data-action]").forEach(button => {
  button.addEventListener("click", async () => {
    if (busy) return;
    const action = button.dataset.action;
    if (action === "back") {
      paymentOptions.hidden = true;
      mainOptions.hidden = false;
      return;
    }
    await chooseMain(action);
  });
});

document.querySelectorAll("[data-method]").forEach(button => {
  button.addEventListener("click", async () => {
    if (!busy) await chooseMethod(button.dataset.method);
  });
});

onAuthStateChanged(auth, async user => {
  if (!user) {
    location.replace("index.html");
    return;
  }

  uid = user.uid;
  chatRef = doc(db, "chats", uid);
  messagesRef = collection(chatRef, "messages");

  try {
    const profileSnap = await getDoc(doc(db, "users", uid));
    const profile = profileSnap.exists() ? profileSnap.data() : {};

    // Create chat only once; do not reset unread status on every page visit.
    const chatSnap = await getDoc(chatRef);
    if (!chatSnap.exists()) {
      await setDoc(chatRef, {
        uid,
        name: profile.name || user.displayName || "",
        phone: profile.phone || "",
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
        unreadByAdmin: false,
        lastMessage: ""
      });
    }

    statusEl.textContent = "Online";
    clearError();

    if (stopMessages) stopMessages();
    stopMessages = onSnapshot(messagesRef, snapshot => {
      messagesEl.innerHTML = "";
      if (snapshot.empty) {
        addBubble("স্বাগতম! নিচের একটি বিষয় নির্বাচন করুন।", "bot");
      } else {
        const docs = snapshot.docs.slice().sort((a, b) => {
          const at = a.data().createdAt?.seconds || 0;
          const bt = b.data().createdAt?.seconds || 0;
          return at - bt;
        });
        docs.forEach(messageDoc => {
          const data = messageDoc.data();
          addBubble(data.text || "", data.sender === "customer" ? "customer" : "bot");
        });
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }, error => {
      statusEl.textContent = "Error";
      showError(friendlyError(error));
    });

  } catch (error) {
    statusEl.textContent = "Setup error";
    showError(friendlyError(error));
  }
});
</script>
</body>
</html>
