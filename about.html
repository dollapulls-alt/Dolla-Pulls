
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolla Pulls | Customer Support</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d031b;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 16px;
  background: #24113b;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 10;
}

header a {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
}

header strong {
  font-size: 16px;
}

#status {
  font-size: 12px;
  color: #d7c7ed;
}

.wrap {
  max-width: 650px;
  margin: 18px auto;
  padding: 12px;
}

.panel {
  background: #1b1030;
  border: 1px solid #553b75;
  border-radius: 18px;
  padding: 14px;
  box-shadow: 0 8px 24px #0006;
}

#errorBox {
  display: none;
  background: #5b1724;
  color: #fff;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

/* MESSAGE AREA */

#messages {
  height: 48vh;
  min-height: 300px;
  max-height: 600px;
  overflow-y: auto;
  padding: 14px;
  background: #10091d;
  border-radius: 14px;
  margin-bottom: 16px;

  display: flex;
  flex-direction: column;
  gap: 8px;

  scroll-behavior: smooth;
}

/* MESSAGE BUBBLES */

.msg {
  width: fit-content;
  max-width: 85%;
  padding: 11px 14px;
  margin: 2px 0;
  border-radius: 14px;

  white-space: pre-wrap;
  overflow-wrap: anywhere;

  font-size: 14px;
  line-height: 1.7;
  word-break: break-word;
}

.msg-label {
  display: block;
  font-size: 10px;
  opacity: .75;
  margin-bottom: 4px;
}

.bot {
  background: #35234e;
  color: #fff;
  margin-right: auto;
  border-bottom-left-radius: 4px;
}

.customer {
  background: #5632a0;
  color: #fff;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

/* BUTTONS */

.options {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 16px 12px;

  background: linear-gradient(135deg, #8754d8, #5531a0);
  color: #fff;

  font-weight: bold;
  font-size: 15px;
  cursor: pointer;

  min-height: 55px;
  transition: .2s;
}

button.sub {
  background: #304a75;
}

button:active {
  transform: scale(.98);
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.note {
  font-size: 12px;
  color: #c9bddb;
  line-height: 1.6;
  margin-top: 14px;
}

[hidden] {
  display: none !important;
}

@media(max-width:480px) {
  header {
    padding: 14px 10px;
  }

  header strong {
    font-size: 14px;
  }

  .wrap {
    padding: 10px;
    margin: 12px auto;
  }

  .panel {
    padding: 12px;
  }

  #messages {
    height: 48vh;
    min-height: 280px;
  }

  .msg {
    max-width: 90%;
    font-size: 14px;
  }

  button {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<header>
  <a href="dashboard.html">← Dashboard</a>
  <strong>Customer Support</strong>
  <span id="status">Connecting…</span>
</header>

<div class="wrap">
  <div class="panel">

    <div id="errorBox" role="alert"></div>

    <div id="messages" aria-live="polite"></div>

    <!-- MAIN OPTIONS -->
    <div class="options" id="mainOptions">

      <button data-action="credit">
        Credit নাম্বার প্রয়োজন
      </button>

      <button data-action="deposit">
        জমা কনফার্ম
      </button>

      <button data-action="withdraw">
        উত্তোলন কনফার্ম
      </button>

      <button data-action="about">
        অ্যাপ সম্পর্কে জানতে চাই
      </button>

      <button data-action="human">
        প্রতিনিধির সঙ্গে কথা বলতে চাই
      </button>

    </div>

    <!-- PAYMENT OPTIONS -->
    <div class="options" id="paymentOptions" hidden>

      <button class="sub" data-method="বিকাশ">
        বিকাশ
      </button>

      <button class="sub" data-method="নগদ">
        নগদ
      </button>

      <button class="sub" data-method="উপায়">
        উপায়
      </button>

      <button class="sub" data-method="সরাসরি ব্যাংক">
        সরাসরি ব্যাংক
      </button>

      <button data-action="back">
        ← আগের মেনু
      </button>

    </div>

    <p class="note">
      এটি স্বয়ংক্রিয় সহায়তা ব্যবস্থা।
      কোনো জমা বা উত্তোলন সম্পন্ন হয়েছে কি না,
      তা লেনদেন যাচাইয়ের পর নিশ্চিত হবে।
    </p>

  </div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  onSnapshot,
  serverTimestamp,
  writeBatch
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyBCylzF69zBzqNQ88mLj7aEXUyLqu3rNT0",
  authDomain: "dolla-pulls.firebaseapp.com",
  projectId: "dolla-pulls",
  storageBucket: "dolla-pulls.firebasestorage.app",
  messagingSenderId: "952761946013",
  appId: "1:952761946013:web:72fe061231ee8951c0e974"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* ELEMENTS */

const messagesEl = document.getElementById("messages");
const statusEl = document.getElementById("status");
const errorBox = document.getElementById("errorBox");

const mainOptions = document.getElementById("mainOptions");
const paymentOptions = document.getElementById("paymentOptions");


/* VARIABLES */

let uid = null;
let chatRef = null;
let messagesRef = null;

let busy = false;
let stopMessages = null;


/* ERROR */

function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = "block";
}

function clearError() {
  errorBox.textContent = "";
  errorBox.style.display = "none";
}

function friendlyError(error) {

  console.error(error);

  if (error?.code === "permission-denied") {
    return "Firestore Permission Denied: Firebase Rules এবং Chat Permission পরীক্ষা করুন।";
  }

  if (error?.code === "failed-precondition") {
    return "Firestore Database Setup-এ সমস্যা হয়েছে।";
  }

  if (error?.code === "unavailable") {
    return "ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না।";
  }

  return "চ্যাটে সমস্যা হয়েছে: " +
    (error?.message || "অজানা সমস্যা");
}


/* BUTTON LOCK */

function setButtonsDisabled(disabled) {

  document.querySelectorAll(".options button")
    .forEach(button => {
      button.disabled = disabled;
    });

}


/* MESSAGE DISPLAY */

function addBubble(text, kind) {

  const div = document.createElement("div");

  div.className = "msg " + kind;

  const label = document.createElement("span");

  label.className = "msg-label";

  label.textContent =
    kind === "customer" ? "আপনি" : "Customer Support";

  const content = document.createElement("span");

  content.textContent = text;

  div.appendChild(label);
  div.appendChild(content);

  messagesEl.appendChild(div);

  messagesEl.scrollTop = messagesEl.scrollHeight;
}


/* SAVE MESSAGE + CHAT TOGETHER */

async function saveMessage(text, sender) {

  if (!uid || !chatRef || !messagesRef) {
    return false;
  }

  clearError();

  try {

    const batch = writeBatch(db);

    const newMessageRef = doc(messagesRef);

    batch.set(newMessageRef, {

      text: text,

      sender: sender,

      senderUid: uid,

      createdAt: serverTimestamp(),

      createdAtMs: Date.now()

    });

    batch.update(chatRef, {

      lastMessage: text,

      updatedAt: serverTimestamp(),

      unreadByAdmin: true

    });

    await batch.commit();

    return true;

  } catch (error) {

    showError(friendlyError(error));

    return false;

  }

}


/* CUSTOMER MESSAGE */

async function sendMessage(text) {

  return await saveMessage(text, "customer");

}


/* BOT MESSAGE */

async function botReply(text) {

  return await saveMessage(text, "bot");

}


/* MAIN MENU */

async function chooseMain(action) {

  const labels = {

    credit: "Credit নাম্বার প্রয়োজন",

    deposit: "জমা কনফার্ম",

    withdraw: "উত্তোলন কনফার্ম",

    about: "অ্যাপ সম্পর্কে জানতে চাই",

    human: "প্রতিনিধির সঙ্গে কথা বলতে চাই"

  };


  const sent = await sendMessage(labels[action]);

  if (!sent) return;


  if (action === "credit") {

    mainOptions.hidden = true;

    paymentOptions.hidden = false;

    await botReply(
      "অনুগ্রহ করে আপনার পেমেন্ট পদ্ধতি নির্বাচন করুন।"
    );

  }

  else if (action === "deposit") {

    await botReply(
      "আপনার কনফার্মেশন পেয়েছি। লেনদেন যাচাইয়ের পরই জমার অবস্থা নিশ্চিত হবে।"
    );

  }

  else if (action === "withdraw") {

    await botReply(
      "আপনার কনফার্মেশন পেয়েছি। লেনদেন যাচাইয়ের পরই উত্তোলনের অবস্থা নিশ্চিত হবে।"
    );

  }

  else if (action === "about") {

    await botReply(
      "এটি একটি আয়ের সাইট।"
    );

  }

  else if (action === "human") {

    await botReply(
      "অনুগ্রহপূর্বক mail করুন।"
    );

  }

}


/* PAYMENT METHOD */

async function chooseMethod(method) {

  const sent = await sendMessage(method);

  if (!sent) return;


  mainOptions.hidden = false;

  paymentOptions.hidden = true;


  if (method === "সরাসরি ব্যাংক") {

    await botReply(
      "বুথ থেকে cardless deposit করুন।\n" +
      "Account number: 17459614758"
    );

  }

  else {

    await botReply(
      `${method} অ্যাপে Transfer Money নির্বাচন করুন, এরপর Visa Card নির্বাচন করে এই নম্বরটি ব্যবহার করুন:\n` +
      "Visa Card number: 331256"
    );

  }

}


/* BUTTON EVENTS */

document.querySelectorAll("[data-action]")
.forEach(button => {

  button.addEventListener("click", async () => {

    if (busy) return;

    const action = button.dataset.action;

    if (action === "back") {

      paymentOptions.hidden = true;

      mainOptions.hidden = false;

      return;

    }

    busy = true;

    setButtonsDisabled(true);

    try {

      await chooseMain(action);

    } finally {

      busy = false;

      setButtonsDisabled(false);

    }

  });

});


document.querySelectorAll("[data-method]")
.forEach(button => {

  button.addEventListener("click", async () => {

    if (busy) return;

    busy = true;

    setButtonsDisabled(true);

    try {

      await chooseMethod(button.dataset.method);

    } finally {

      busy = false;

      setButtonsDisabled(false);

    }

  });

});


/* AUTHENTICATION */

onAuthStateChanged(auth, async user => {

  if (!user) {

    location.replace("index.html");

    return;

  }


  uid = user.uid;

  chatRef = doc(db, "chats", uid);

  messagesRef = collection(chatRef, "messages");


  try {

    /* USER PROFILE */

    const profileSnap = await getDoc(
      doc(db, "users", uid)
    );

    const profile = profileSnap.exists()
      ? profileSnap.data()
      : {};


    /* CHAT DOCUMENT */

    const chatSnap = await getDoc(chatRef);


    if (!chatSnap.exists()) {

      await setDoc(chatRef, {

        uid: uid,

        name: profile.name || user.displayName || "",

        phone: profile.phone || "",

        createdAt: serverTimestamp(),

        updatedAt: serverTimestamp(),

        unreadByAdmin: false,

        lastMessage: ""

      });

    }


    statusEl.textContent = "Online";

    clearError();


    /* LIVE MESSAGES */

    if (stopMessages) {

      stopMessages();

    }


    stopMessages = onSnapshot(

      messagesRef,

      snapshot => {

        messagesEl.innerHTML = "";


        if (snapshot.empty) {

          addBubble(
            "স্বাগতম! নিচের একটি বিষয় নির্বাচন করুন।",
            "bot"
          );

          return;

        }


        /* SORT MESSAGES */

        const docs = snapshot.docs.slice().sort((a, b) => {

          const A = a.data();

          const B = b.data();


          const at = A.createdAtMs ??
            ((A.createdAt?.seconds || 0) * 1000);

          const bt = B.createdAtMs ??
            ((B.createdAt?.seconds || 0) * 1000);


          if (at !== bt) {

            return at - bt;

          }


          return a.id.localeCompare(b.id);

        });


        /* DISPLAY MESSAGES */

        docs.forEach(messageDoc => {

          const data = messageDoc.data();

          addBubble(

            data.text || "",

            data.sender === "customer"
              ? "customer"
              : "bot"

          );

        });


        messagesEl.scrollTop = messagesEl.scrollHeight;

      },


      error => {

        statusEl.textContent = "Error";

        showError(friendlyError(error));

      }

    );


  } catch (error) {

    statusEl.textContent = "Setup error";

    showError(friendlyError(error));

  }

});

</script>

</body>
</html>
