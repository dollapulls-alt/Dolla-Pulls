<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dolla Pulls | Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',Arial,sans-serif;background-image:url("https://raw.githubusercontent.com/theworldvegas/theworldvegas/main/assets/index.gif");background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;position:relative;overflow-x:hidden}
.container{width:100%;max-width:440px;padding:20px;position:relative;z-index:10}
.header{text-align:center;padding-bottom:25px}.header h1{margin:0;font-size:32px;font-weight:600;color:#00f2fe;text-shadow:0 0 15px rgba(0,242,254,.4)}.header p{margin:5px 0 0;font-size:14px;color:rgba(255,255,255,.6)}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(0,242,254,.35);border-radius:24px;padding:35px 30px;backdrop-filter:blur(15px);box-shadow:0 0 40px rgba(0,242,254,.15),inset 0 0 15px rgba(255,255,255,.02)}
.tabs{display:flex;margin-bottom:30px;background:rgba(255,255,255,.05);border-radius:30px;padding:5px;border:1px solid rgba(255,255,255,.1)}
.tab{flex:1;text-align:center;padding:12px;cursor:pointer;border-radius:25px;color:rgba(255,255,255,.6);font-weight:500;transition:all .3s ease}.tab.active{background:rgba(0,242,254,.2);color:#00f2fe;box-shadow:inset 0 0 10px rgba(0,242,254,.2)}
.input-wrapper{position:relative;margin-top:20px}
input{width:100%;padding:15px 20px;border-radius:30px;border:1.5px solid rgba(255,255,255,.4);outline:none;background:rgba(255,255,255,.05);color:#fff;font-size:15px;transition:all .3s ease}
input::placeholder{color:rgba(255,255,255,.5)}input:focus{border-color:#00f2fe;box-shadow:0 0 12px rgba(0,242,254,.3)}input[type=date]{color-scheme:dark}
button{width:100%;padding:15px;margin-top:30px;border:1.5px solid rgba(255,255,255,.4);border-radius:30px;background:transparent;color:#fff;font-size:16px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .3s ease}
button:hover{background:rgba(255,255,255,.08);border-color:#00f2fe;box-shadow:0 0 15px rgba(0,242,254,.4)}button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.link{margin-top:20px;text-align:center;color:rgba(255,255,255,.6);cursor:pointer;font-size:14px}.link:hover{color:#00f2fe;text-decoration:underline}.hide{display:none}
.note{font-size:12px;line-height:1.6;color:rgba(255,255,255,.62);margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>Dolla Pulls</h1><p>Powered By finance.yahoo.com</p></div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" id="loginTab" onclick="showLogin()">Log in</div>
      <div class="tab" id="signupTab" onclick="showSignup()">Sign up</div>
    </div>
    <div id="loginBox">
      <div class="input-wrapper"><input id="loginPhone" type="tel" placeholder="Phone number" inputmode="tel" autocomplete="tel"></div>
      <div class="input-wrapper"><input id="loginPass" type="password" placeholder="Password" autocomplete="current-password"></div>
      <button id="loginBtn" onclick="login()">LOG IN</button>
      <div class="link" onclick="forgotPassword()">Forgot password?</div>
    </div>
    <div id="signupBox" class="hide">
      <div class="input-wrapper"><input id="nidName" type="text" placeholder="NID NAME (ENG)" autocomplete="name"></div>
      <div class="input-wrapper"><input id="nidNumber" type="text" placeholder="NID NUMBER" inputmode="numeric" autocomplete="off"></div>
      <div class="input-wrapper"><input id="dateOfBirth" type="date" aria-label="Date of birth"></div>
      <div class="input-wrapper"><input id="mfsPhone" type="tel" placeholder="Phone number (MFS)" inputmode="tel" autocomplete="tel"></div>
      <div class="input-wrapper"><input id="signupPass" type="password" placeholder="PASSWORD" autocomplete="new-password"></div>
      <div class="input-wrapper"><input id="signupPass2" type="password" placeholder="RE-ENTER PASSWORD" autocomplete="new-password"></div>
      <div class="input-wrapper"><input id="referCode" type="text" placeholder="REFERRED CODE (OPTIONAL)"></div>
      <button id="signupBtn" onclick="signup()">CONTINUE</button>
      <div class="note">An NID and a phone number can be used only once.</div>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, deleteUser, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

function normalizePhone(value) {
  let phone = String(value || "").trim().replace(/[\s-]/g, "");
  if (phone.startsWith("+880")) phone = "0" + phone.slice(4);
  else if (phone.startsWith("880")) phone = "0" + phone.slice(3);
  else if (phone.startsWith("+88")) phone = phone.slice(3);
  else if (phone.startsWith("88")) phone = phone.slice(2);
  return phone;
}
const firebaseConfig = {
  apiKey: "AIzaSyBCylzF69zBzqNQ88mLj7aEXUyLqu3rNT0",
  authDomain: "dolla-pulls.firebaseapp.com",
  projectId: "dolla-pulls"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

window.showSignup = () => {
  $("loginBox").classList.add("hide"); $("signupBox").classList.remove("hide");
  $("loginTab").classList.remove("active"); $("signupTab").classList.add("active");
};
window.showLogin = () => {
  $("signupBox").classList.add("hide"); $("loginBox").classList.remove("hide");
  $("signupTab").classList.remove("active"); $("loginTab").classList.add("active");
};

window.signup = async () => {
  const btn = $("signupBtn");
  if (btn.disabled) return;
  const nidName = $("nidName").value.trim().replace(/\s+/g, " ");
  const nidNumber = $("nidNumber").value.trim();
  const dateOfBirth = $("dateOfBirth").value;
  const phone = normalizePhone($("mfsPhone").value);
  const password = $("signupPass").value;
  const confirmPassword = $("signupPass2").value;
  const referCode = $("referCode").value.trim();

  if (!nidName || !nidNumber || !dateOfBirth || !phone || !password || !confirmPassword) return alert("Please fill all required fields.");
  if (!/^[A-Za-z][A-Za-z .'-]*$/.test(nidName)) return alert("Please enter NID name in English.");
  if (!/^(?:\d{10}|\d{13}|\d{17})$/.test(nidNumber)) return alert("Invalid NID number. Enter 10, 13 or 17 digits.");
  if (!/^01[3-9]\d{8}$/.test(phone)) return alert("Please enter a valid Bangladesh mobile/MFS number.");
  const dob = new Date(dateOfBirth + "T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  if (Number.isNaN(dob.getTime()) || dob >= today) return alert("Invalid date of birth.");
  if (password.length < 6) return alert("Password must be at least 6 characters.");
  if (password !== confirmPassword) return alert("Password mismatch.");

  btn.disabled = true; btn.innerText = "Processing...";
  let createdUser = null;
  try {
    const credential = await createUserWithEmailAndPassword(auth, phone + "@binoyog.com", password);
    createdUser = credential.user;
    const uid = createdUser.uid;
    const batch = writeBatch(db);

    batch.set(doc(db, "users", uid), {
      uid, name: nidName, nidName, nidNumber, dateOfBirth,
      phone, mfsPhone: phone, referCode: referCode || null,
      balance: 0, role: "user", createdAt: serverTimestamp()
    });
    batch.set(doc(db, "nid_registry", nidNumber), {
      uid, nidNumber, createdAt: serverTimestamp()
    });
    batch.set(doc(db, "phone_registry", phone), {
      uid, phone, createdAt: serverTimestamp()
    });
    await batch.commit();
    await signOut(auth);
    alert("Signup successful. Please login.");
    showLogin();
    $("loginPhone").value = phone;
    $("loginPass").value = "";
  } catch (error) {
    console.error("Signup error:", error);
    let rollbackFailed = false;
    if (createdUser) {
      try { await deleteUser(createdUser); }
      catch (rollbackError) { rollbackFailed = true; console.error("Auth rollback error:", rollbackError); }
    }
    if (error.code === "auth/email-already-in-use") {
      alert("An account already exists with this number. Please Login");
    } else if (error.code === "permission-denied" || error.code === "firestore/permission-denied") {
      alert("please submit correct information" + (rollbackFailed ? "mail for help।" : ""));
    } else {
      alert((error.message || "Signup failed.") + (rollbackFailed ? "\nplease delete Authentication account manually" : ""));
    }
  } finally { btn.disabled = false; btn.innerText = "CONTINUE"; }
};

window.login = async () => {
  const btn = $("loginBtn"); if (btn.disabled) return;
  const phone = normalizePhone($("loginPhone").value);
  const password = $("loginPass").value;
  if (!/^01[3-9]\d{8}$/.test(phone) || !password) return alert("Please enter correct information");
  btn.disabled = true; btn.innerText = "Processing...";
  try {
    await signInWithEmailAndPassword(auth, phone + "@binoyog.com", password);
    location.href = "dashboard.html";
  } catch (error) {
    console.error("Login error:", error);
    alert("Wrong phone number or password.");
    btn.disabled = false; btn.innerText = "LOG IN";
  }
};
window.forgotPassword = () => alert("please mail for reset passwort");
</script>
</body>
</html>
